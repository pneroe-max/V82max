<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#100F0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="V8 Tracker">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>V8 Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     TEMA v5 "VETRO & VIOLA" — sintesi img1 (nero+viola, card dati)
     + img2 (vetro caldo su sfere). Accento UI viola elettrico;
     i 5 colori-disco restano per i giorni (colore = informazione).
     Font: Sora (geometrico, numeri puliti).
     ============================================================ */
  :root {
    --bg: #0B0A0F; --surface: #16141C; --surface-2: #1C1925;
    --line: rgba(255,255,255,0.07); --ink: #F4F2F8; --muted: #908AA0;
    --violet: #A855F7; --violet-2: #7C3AED; --violet-soft: rgba(168,85,247,0.16);
    /* dischi calibrati per i giorni */
    --p-red: #E0524A; --p-blue: #4D82E8; --p-yellow: #E8B43C; --p-green: #3FB66C; --p-purple: #A855F7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background:
      radial-gradient(ellipse 100% 60% at 20% 0%, rgba(90,24,154,0.18), transparent 60%),
      radial-gradient(ellipse 90% 50% at 90% 30%, rgba(181,23,158,0.12), transparent 60%),
      #0A0810;
    color: var(--ink);
    font-family: 'Sora', -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    overflow-x: hidden;
  }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  button { font-family: inherit; transition: transform 0.12s ease, opacity 0.12s ease, background 0.15s ease; }
  button:active { transform: scale(0.97); }
  input { transition: border-color 0.15s ease, box-shadow 0.15s ease; }
  input:focus { border-color: var(--violet) !important; box-shadow: 0 0 0 3px var(--violet-soft); }
  :focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  /* SFERE AMBIENTALI — sature di loro, NESSUN blend mode (robusto ovunque).
     Su nero profondo un radiale a colore pieno è già luminoso;
     blur moderato per non spegnerle. */
  .ambient-glow { position: fixed; pointer-events: none; z-index: 0; border-radius: 50%; filter: blur(46px); opacity: 0.95; }
  .glow-1 { top: -60px; left: -50px; width: 290px; height: 290px; background: radial-gradient(circle at 42% 40%, #C77DFF 0%, #8E2DE2 45%, rgba(142,45,226,0) 76%); }
  .glow-2 { top: 21%; right: -130px; width: 230px; height: 230px; opacity: 0.8; background: radial-gradient(circle at 50% 50%, #FF5FC1 0%, #C2179B 46%, rgba(194,23,155,0) 76%); }
  .glow-3 { bottom: -110px; left: 4%; width: 330px; height: 300px; opacity: 0.85; background: radial-gradient(circle at 50% 45%, #8C6BFF 0%, #5F2EEA 48%, rgba(95,46,234,0) 78%); }
  .glow-4 { position: fixed; pointer-events: none; z-index: 0; border-radius: 50%; filter: blur(50px); opacity: 0.65; top: 58%; left: -110px; width: 220px; height: 220px; background: radial-gradient(circle at 50% 50%, #53C8F0 0%, #3D5AF1 48%, rgba(61,90,241,0) 78%); }
  @keyframes slideUp { from { transform: translate(-50%, 100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  @keyframes slideDown { from { transform: translate(0, -100%); opacity: 0; } to { transform: translate(0, 0); opacity: 1; } }
  @keyframes slideUpModal { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fadeInModal { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 rgba(168, 85, 247, 0); } 50% { box-shadow: 0 0 14px rgba(168, 85, 247, 0.45); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .shimmer-bg { background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 100%); background-size: 200% 100%; animation: shimmer 2s infinite; }
</style>
</head>
<body>
<div class="ambient-glow glow-1"></div>
<div class="ambient-glow glow-2"></div>
<div class="ambient-glow glow-3"></div>
<div class="glow-4"></div>
<div id="root" style="position: relative; z-index: 1;"></div>

  let outReps = reps;

  return {
    sets,
    reps: outReps,
    rir,
    blockName: phase.name,
    variable: phase.variable,
    loadCue: phase.load
  };
};
