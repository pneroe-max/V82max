// Hook per gestire il tasto indietro hardware Android.
// Ogni schermata interna chiama useAndroidBack(goBack), che:
//  1) al mount, fa history.pushState (così c'è un entry da poppare)
//  2) ascolta popstate: quando l'utente preme back, chiama goBack()
//  3) al unmount, rimuove il listener
// BackStack globale: LIFO di handler. Il TOP riceve il prossimo back.
// Schermate interne e modal pushano un handler quando si aprono e lo poppano quando si chiudono.
// Un solo listener popstate a livello globale, niente race condition.
const BackStackContext = createContext(null);

function BackStackProvider({ children }) {
  const stackRef = useRef([]); // array di { id, handler }
  // popInProgress: true quando popHandler viene chiamato come conseguenza di popstate
  // (back hardware). Evita history.back() ricorsivi.
  const popInProgressRef = useRef(false);
  const initRef = useRef(false);

  useEffect(() => {
    if (typeof window === 'undefined') return;
    if (!initRef.current) {
      initRef.current = true;
      try {
        if (!window.history.state || !window.history.state.vbBase) {
          window.history.replaceState({ vbBase: true }, '');
        }
      } catch (e) {}
    }
    const onPop = () => {
      // Prendo il top dello stack interno. Se vuoto o handler obsoleto, lascio
      // che il browser gestisca normalmente (continua a tornare indietro).
      const top = stackRef.current[stackRef.current.length - 1];
      if (top) {
        popInProgressRef.current = true;
        try { top.handler(); } finally {
          Promise.resolve().then(() => { popInProgressRef.current = false; });
        }
      }
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const pushHandler = useCallback((handler) => {
    const id = Math.random().toString(36).slice(2);
    stackRef.current.push({ id, handler });
    try { window.history.pushState({ vbStackId: id }, ''); } catch (e) {}
    return id;
  }, []);

  const popHandler = useCallback((id) => {
    const idx = stackRef.current.findIndex(h => h.id === id);
    if (idx === -1) return;
    stackRef.current.splice(idx, 1);
    // Niente history.back() di cleanup: alcuni browser mobile bloccano lo scroll
    // dopo certe sequenze di pushState/back rapide. Lasciamo lo storico browser
    // leggermente piu' lungo dello stack interno: e' innocuo perche' onPop
    // controlla sempre lo stack interno per trovare l'handler da eseguire.
    // Conseguenza: dopo chiusure programmatiche multiple, l'utente potrebbe dover
    // premere back 1 volta in piu' per uscire dall'app. E' un compromesso accettabile.
  }, []);

  return (
    <BackStackContext.Provider value={{ pushHandler, popHandler }}>
      {children}
    </BackStackContext.Provider>
  );
}

// Hook: registra un handler quando 'enabled' è true. Quando enabled diventa false o il componente smonta,
// l'handler viene rimosso. Quando l'utente preme back e l'handler è in cima allo stack, viene chiamato.
function useAndroidBack(handler, enabled = true) {
  const ctx = useContext(BackStackContext);
  const handlerRef = useRef(handler);
  useEffect(() => { handlerRef.current = handler; }, [handler]);

  useEffect(() => {
    if (!enabled || !ctx) return;
    const id = ctx.pushHandler(() => handlerRef.current && handlerRef.current());
    return () => ctx.popHandler(id);
  }, [enabled, ctx]);
}

// ============= LOGICA BLOCCHI =============

// ===== V8.3.4 — Progressione evidence-based =====
// Volume FISSO sett 1-7 (Grgic 2017). Una sola variabile per settimana
// (Plotkin 2022/Chaves 2024): rep nelle sett di accumulo (2,3,5,6),
// carico nelle sett di salita (4,7). RIR conservativo in deficit
// (compound mai sotto 1). Deload vero solo a sett 8.
const WEEK_PHASE = {
  1: { name: 'ADATTAMENTO', variable: 'Stabilisci i carichi', repPos: 'bottom', compRir: '3',   accRir: '2',   load: 'base' },
  2: { name: 'ACCUMULO REP', variable: '+1 rep · carico fermo', repPos: 'mid',   compRir: '2-3', accRir: '1-2', load: 'hold' },
  3: { name: 'ACCUMULO REP', variable: '+1 rep → top range',    repPos: 'top',   compRir: '2',   accRir: '1',   load: 'hold' },
  4: { name: 'SALITA CARICO', variable: '+carico · rep al fondo', repPos: 'bottom', compRir: '2', accRir: '1',   load: 'up' },
  5: { name: 'ACCUMULO REP', variable: '+1 rep · carico fermo', repPos: 'mid',   compRir: '2',   accRir: '0-1', load: 'hold' },
  6: { name: 'ACCUMULO REP', variable: '+1 rep → top range',    repPos: 'top',   compRir: '1-2', accRir: '0-1', load: 'hold' },
  7: { name: 'SALITA + PICCO', variable: '+carico · rep al fondo', repPos: 'bottom', compRir: '1', accRir: '0-1', load: 'up' },
  8: { name: 'DELOAD + OFF', variable: '−15% carico · metà set', repPos: 'mid',   compRir: '3-4', accRir: '3',   load: 'deload' },
};

// Ricava i target rep per la fase a partire dal range base "min-max"
const repTargetForPhase = (baseReps, repPos) => {
  const r = parseRepRange(baseReps);
  if (!r.max || r.max === r.min) return baseReps;
  if (repPos === 'bottom') return String(r.min);
  if (repPos === 'top') return String(r.max);
  // mid = un gradino sopra il fondo (doppia progressione)
  return String(Math.min(r.max, r.min + 1));
};

const applyBlockLogic = (exercise, week) => {
  let { sets, reps, rir, rest, isCompound } = exercise;
  const phase = WEEK_PHASE[week] || WEEK_PHASE[1];
  // Volume fisso S1-7; deload S8 = metà serie (min 1)
  if (week >= 8) sets = Math.max(1, Math.round(sets / 2));
  // RIR dalla fase (compound vs accessori)
  rir = isCompound ? phase.compRir : phase.accRir;
  // Rep: doppia progressione a singola variabile, su superset/AMRAP non tocco il formato
  if (!reps.includes('+') && !reps.includes('AMRAP')) {
    reps = repTargetForPhase(reps, phase.repPos);
  }
  return { sets, reps, rir, rest, blockName: phase.name, variable: phase.variable, loadCue: phase.load };
};

const parseRepRange = (repString) => {
  if (!repString) return { min: 0, max: 0 };
  const cleaned = repString.replace('AMRAP', '').replace('+', '').trim();
  if (cleaned.includes('-')) {
    const [min, max] = cleaned.split('-').map(r => parseInt(r));
    return { min: min || 0, max: isNaN(max) ? min : max };
  }
  return { min: parseInt(cleaned) || 0, max: parseInt(cleaned) || 0 };
};

const isLowerBody = (tags) => tags.some(t => ['QUAD', 'HAM', 'GLUTE', 'POLP'].includes(t));

const getSuggestedWeight = (exercise, currentWeek, dayId, allWorkouts, exIdx, phaseMap) => {
  const PH = phaseMap || WEEK_PHASE;
  if (currentWeek <= 1) return null;
  const prevWeekData = allWorkouts[currentWeek - 1]?.[dayId]?.esercizi;
  if (!prevWeekData) return null;
  if (exIdx == null || exIdx === -1) return null;
  const prevLog = prevWeekData[exIdx];
  if (!prevLog || !prevLog.kg) return null;
  const prevWeight = parseFloat(prevLog.kg);
  if (isNaN(prevWeight)) return null;
  const increment = isLowerBody(exercise.tags) ? 5 : 2.5;
  const phase = PH[currentWeek] || PH[1];
  // Carico sale solo nelle settimane di "salita" (loadCue 'up'),
  // scende al deload, resta fermo nelle settimane di accumulo rep.
  if (phase.loadCue === 'up') return (prevWeight + increment).toFixed(1);
  if (phase.loadCue === 'deload') return (Math.round((prevWeight * 0.85) / 2.5) * 2.5).toFixed(1);
  return prevWeight.toFixed(1); // hold: aggiungi rep, non carico
};

const parseRestSeconds = (restStr) => {
  if (!restStr) return 90;
  const firstPart = restStr.split('-')[0].trim();
  if (firstPart.includes('s')) return parseInt(firstPart);
  const [m, s] = firstPart.split(':').map(n => parseInt(n));
  return (m || 0) * 60 + (s || 0);
};

  get(key) { try { const v = localStorage.getItem(KEY_PREFIX + key); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(key, value) { try { localStorage.setItem(KEY_PREFIX + key, JSON.stringify(value)); return true; } catch (e) { return false; } },
  exportAll() {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(KEY_PREFIX)) data[k.replace(KEY_PREFIX, '')] = JSON.parse(localStorage.getItem(k));
    }
    return data;
  },
  importAll(data) { Object.entries(data).forEach(([k, v]) => { localStorage.setItem(KEY_PREFIX + k, JSON.stringify(v)); }); },
  clearAll() {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(KEY_PREFIX)) keys.push(k); }
    keys.forEach(k => localStorage.removeItem(k));
  },
};

// Salvataggio debounced: evita una scrittura sincrona su localStorage a ogni
// tasto premuto (jank su mobile). Flush garantito quando l'app va in background.
const _saveTimers = {};
const _pendingSaves = {};
const scheduleSave = (key, data, delay = 350) => {
  _pendingSaves[key] = data;
  clearTimeout(_saveTimers[key]);
  _saveTimers[key] = setTimeout(() => {
    if (key in _pendingSaves) { storage.set(key, _pendingSaves[key]); delete _pendingSaves[key]; }
  }, delay);
};
const flushSaves = () => {
  Object.keys(_pendingSaves).forEach(k => {
    clearTimeout(_saveTimers[k]);
    storage.set(k, _pendingSaves[k]);
    delete _pendingSaves[k];
  });
};
window.addEventListener('pagehide', flushSaves);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSaves(); });

const TimerContext = createContext(null);

function TimerProvider({ children }) {
  const [active, setActive] = useState(null);
  const [remaining, setRemaining] = useState(0);
  const [running, setRunning] = useState(false);
  const [soundEnabled, setSoundEnabled] = useState(true);
  const intervalRef = useRef(null);
  const finishedRef = useRef(false);

  useEffect(() => {
    const sound = storage.get('soundEnabled');
    if (sound !== null) setSoundEnabled(sound);
    const saved = storage.get('activeTimer');
    if (saved && saved.startedAt) {
      const elapsed = Math.floor((Date.now() - saved.startedAt) / 1000);
      const newRemaining = saved.totalSeconds - elapsed;
      if (newRemaining > 0 && newRemaining < saved.totalSeconds + 60) {
        setActive(saved); setRemaining(newRemaining); setRunning(true);
      } else { storage.set('activeTimer', null); }
    }
  }, []);

  const startTimer = useCallback((seconds, exerciseName = '') => {
    const newTimer = { totalSeconds: seconds, startedAt: Date.now(), exerciseName };
    finishedRef.current = false;
    setActive(newTimer); setRemaining(seconds); setRunning(true);
    storage.set('activeTimer', newTimer);
  }, []);

  const stopTimer = useCallback(() => {
    setActive(null); setRemaining(0); setRunning(false);
    storage.set('activeTimer', null);
    if (intervalRef.current) { clearInterval(intervalRef.current); intervalRef.current = null; }
  }, []);

  const resetTimer = useCallback(() => {
    if (active) {
      const reset = { ...active, startedAt: Date.now() };
      finishedRef.current = false;
      setActive(reset); setRemaining(active.totalSeconds); setRunning(true);
      storage.set('activeTimer', reset);
    }
  }, [active]);

  const togglePause = useCallback(() => {
    if (running) {
      const newTimer = { ...active, totalSeconds: remaining, startedAt: null };
      setActive(newTimer); setRunning(false);
      storage.set('activeTimer', newTimer);
    } else {
      const newTimer = { ...active, startedAt: Date.now() };
      setActive(newTimer); setRunning(true);
      storage.set('activeTimer', newTimer);
    }
  }, [running, active, remaining]);

  const toggleSound = useCallback(() => {
    setSoundEnabled(prev => { const v = !prev; storage.set('soundEnabled', v); return v; });
  }, []);

  useEffect(() => {
    if (running && remaining > 0) {
      intervalRef.current = setInterval(() => {
        setRemaining(r => {
          if (r <= 1) {
            if (!finishedRef.current) {
              finishedRef.current = true;
              if (soundEnabled) {
                try {
                  const ctx = new (window.AudioContext || window.webkitAudioContext)();
                  const osc = ctx.createOscillator();
                  const gain = ctx.createGain();
                  osc.connect(gain); gain.connect(ctx.destination);
                  osc.frequency.value = 880;
                  gain.gain.setValueAtTime(0.3, ctx.currentTime);
                  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                  osc.start(); osc.stop(ctx.currentTime + 0.5);
                } catch (e) {}
              }
              if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            }
            setRunning(false);
            return 0;
          }
          return r - 1;
        });
      }, 1000);
    }
    return () => { if (intervalRef.current) clearInterval(intervalRef.current); };
  }, [running, soundEnabled]);

  return (
    <TimerContext.Provider value={{ active, remaining, running, soundEnabled, startTimer, stopTimer, resetTimer, togglePause, toggleSound }}>
      {children}
      {active && <FloatingTimer />}
    </TimerContext.Provider>
  );
}

function FloatingTimer() {
  const { active, remaining, running, soundEnabled, stopTimer, resetTimer, togglePause, toggleSound } = useTimer();
  const [collapsed, setCollapsed] = useState(false);
  if (!active) return null;
  const min = Math.floor(remaining / 60);
  const sec = remaining % 60;
  const pct = active.totalSeconds > 0 ? ((active.totalSeconds - remaining) / active.totalSeconds) * 100 : 0;
  const isLowTime = remaining <= 10 && remaining > 0;
  const isFinished = remaining === 0;
  const bg = isFinished
    ? 'linear-gradient(180deg, #3FB66C, #2E8F54)'
    : isLowTime
      ? 'linear-gradient(180deg, #E0524A, #B83E37)'
      : 'linear-gradient(180deg, #1F1C17, #161410)';

  if (collapsed) {
    return (
      <div onClick={() => setCollapsed(false)} style={{
        position: 'fixed', top: '12px', right: '12px', zIndex: 999,
        ...glassCard, background: bg, padding: '8px 12px', borderRadius: '14px',
        cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '6px',
        animation: 'slideDown 0.3s ease-out', boxShadow: '0 4px 16px rgba(0,0,0,0.4)',
      }}>
        <Timer size={14} color="#fff"/>
        <span style={{ fontSize: '14px', fontWeight: '700', color: '#F4F2F8', minWidth: '40px' }}>
          {String(min).padStart(2, '0')}:{String(sec).padStart(2, '0')}
        </span>
      </div>
    );
  }

  return (
    <div style={{
      position: 'fixed', bottom: '12px', left: '50%', transform: 'translateX(-50%)',
      zIndex: 999, width: '94%', maxWidth: '460px', background: bg,
      border: `1px solid ${isFinished ? '#3FB66C' : isLowTime ? '#E0524A' : 'rgba(232,176,40,0.4)'}`, borderRadius: '14px',
      padding: '12px 14px', animation: 'slideUp 0.3s ease-out', boxShadow: '0 8px 32px rgba(0,0,0,0.55)',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
        <Timer size={20} color={isFinished || isLowTime ? '#fff' : '#E8B43C'}/>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: '10px', color: isFinished || isLowTime ? 'rgba(255,255,255,0.9)' : '#908AA0', textTransform: 'uppercase', letterSpacing: '0.1em', fontWeight: '600', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
            {isFinished ? 'Recupero finito' : (active.exerciseName || 'Recupero')}
          </div>
          <div style={{ fontFamily: displayFont, fontSize: '28px', fontWeight: '800', color: isFinished || isLowTime ? '#fff' : '#F4F2F8', lineHeight: 1, letterSpacing: '0.02em' }}>
            {String(min).padStart(2, '0')}:{String(sec).padStart(2, '0')}
          </div>
        </div>
        <button onClick={toggleSound} style={timerBtn}>{soundEnabled ? <Volume2 size={14}/> : <VolumeX size={14}/>}</button>
        <button onClick={togglePause} style={timerBtn}>{running ? <Pause size={14}/> : <Play size={14}/>}</button>
        <button onClick={resetTimer} style={timerBtn}><RotateCcw size={14}/></button>
        <button onClick={() => setCollapsed(true)} style={{...timerBtn, fontSize: '13px', fontWeight: '700', padding: '6px 8px'}}>—</button>
        <button onClick={stopTimer} style={{...timerBtn, fontSize: '13px', fontWeight: '700', padding: '6px 8px'}}>✕</button>
      </div>
      <div style={{ height: '4px', background: 'rgba(244,242,248,0.15)', borderRadius: '2px', marginTop: '8px', overflow: 'hidden' }}>
        <div style={{ height: '100%', width: `${pct}%`, background: isFinished ? '#fff' : isLowTime ? '#fff' : '#E8B43C', transition: 'width 0.3s linear' }}/>
      </div>
    </div>
  );
}

            <span style={{ fontFamily: displayFont, fontSize: '30px', fontWeight: '700', color: '#908AA0', lineHeight: 0.9 }}>.{stats.peso === '—' ? '0' : (stats.peso.replace(' kg','').split('.')[1] || '0')} kg</span>

            <span style={{ fontSize: '13px', fontWeight: '700' }}>CUT</span>
          </div>
        </div>
        <div style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', marginTop: '10px', background: 'rgba(255,255,255,0.05)', backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: '16px', padding: '5px 11px' }}>

          V8 Tracker v6 · Protocollo V8.3.4 · 92 kg<br/>Dati salvati sul dispositivo
        </div>
      </div>
    </div>
  );
}

// ============= WORKOUT =============

const MAIN_CONFIG = {
  exercises: EXERCISES, days: DAYS, blocks: BLOCKS,
  phase: WEEK_PHASE, applyLogic: applyBlockLogic, suggestWeight: getSuggestedWeight,
  storageKey: 'workouts', weeks: [1,2,3,4,5,6,7,8], rotation: true,
};

function WorkoutScreen({ goBack, config = MAIN_CONFIG }) {
  const { exercises: EXS, days: DYS, blocks: BLKS, phase: PHASE, applyLogic, suggestWeight, storageKey, weeks: WEEKS, rotation } = config;
  const { startTimer } = useTimer();
  const [view, setView] = useState('select');
  const [selectedWeek, setSelectedWeek] = useState(WEEKS[0]);
  const [selectedDay, setSelectedDay] = useState(null);
  const [data, setData] = useState({});
  const [detailExercise, setDetailExercise] = useState(null);

  const handleInternalBack = useCallback(() => {
    if (detailExercise) { setDetailExercise(null); return; }
    if (view === 'day') { setView('select'); return; }
  }, [detailExercise, view]);
  useAndroidBack(handleInternalBack, !!detailExercise || view === 'day');

  useEffect(() => { setData(storage.get(storageKey) || {}); }, [storageKey]);
  // Flush dei salvataggi in sospeso quando si lascia la schermata
  useEffect(() => () => flushSaves(), []);

  // Wake lock: schermo acceso durante l'allenamento (vista giorno).
  // Feature-detected: dove non supportato è un no-op silenzioso.
  useEffect(() => {
    if (view !== 'day') return;
    let lock = null, active = true;
    const acquire = async () => {
      try { if ('wakeLock' in navigator) { lock = await navigator.wakeLock.request('screen'); } } catch (e) {}
    };
    acquire();
    const onVis = () => { if (active && document.visibilityState === 'visible') acquire(); };
    document.addEventListener('visibilitychange', onVis);
    return () => {
      active = false;
      document.removeEventListener('visibilitychange', onVis);
      try { if (lock) lock.release(); } catch (e) {}
    };
  }, [view]);

  const getBlock = (week) => BLKS.find(b => b.weeks.includes(week)) || BLKS[0];

  const updateExercise = (week, day, exIdx, field, value, setIdx) => {
    setData(prev => {
      const wk = prev[week] || {};
      const dy = wk[day] || { esercizi: {}, completato: false };
      const ex = dy.esercizi?.[exIdx] || { kg: '', reps: ['', '', '', ''], rir: '', sets_done: [] };
      let newEx;
      if (field === 'kg' || field === 'rir') newEx = { ...ex, [field]: value };
      else if (field === 'reps') { const reps = [...(ex.reps || [])]; reps[setIdx] = value; newEx = { ...ex, reps }; }
      else { const sd = [...(ex.sets_done || [])]; sd[setIdx] = value; newEx = { ...ex, sets_done: sd }; }
      const next = { ...prev, [week]: { ...wk, [day]: { ...dy, esercizi: { ...(dy.esercizi || {}), [exIdx]: newEx } } } };
      // Digitazione (kg/reps/rir) → debounced. Toggle serie → immediato.
      if (field === 'sets_done') { storage.set(storageKey, next); }
      else { scheduleSave(storageKey, next); }
      return next;
    });
  };

  const toggleComplete = (week, day) => {
    setData(prev => {
      const wk = prev[week] || {};
      const dy = wk[day] || { esercizi: {}, completato: false };
      const next = { ...prev, [week]: { ...wk, [day]: { ...dy, completato: !dy.completato } } };
      storage.set(storageKey, next);
      return next;
    });
  };

  const isCompleted = (week, day) => data[week]?.[day]?.completato || false;

  if (detailExercise) {
    return <ExerciseDetailScreen exercise={detailExercise} week={selectedWeek} dayId={selectedDay} goBack={() => setDetailExercise(null)} applyLogic={applyLogic} days={DYS}/>;
  }

  if (view === 'select') {
    const block = getBlock(selectedWeek);
    return (
      <div style={{ minHeight: '100vh', background: 'transparent', paddingBottom: '120px' }}>
        <Header title="Allenamento" subtitle="Seleziona settimana e giorno" onBack={goBack} />
        <div style={{ padding: '0 12px' }}>
          <div style={{ ...glassCard, padding: '16px', marginBottom: '14px' }}>
            <div style={{ fontFamily: displayFont, fontSize: '12px', textTransform: 'uppercase', color: '#908AA0', marginBottom: '10px', letterSpacing: '0.16em', fontWeight: '700' }}>Settimana</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '6px' }}>
              {WEEKS.map(w => {
                const b = getBlock(w);
                const active = selectedWeek === w;
                return (
                  <button key={w} onClick={() => setSelectedWeek(w)} style={{
                    padding: '11px 0',
                    background: active ? b.color : '#0E0D0B',
                    color: active ? '#100F0D' : '#908AA0',
                    border: active ? `1px solid ${b.color}` : '1px solid var(--line)',
                    borderRadius: '10px', fontWeight: '800', fontSize: '17px', cursor: 'pointer',
                    fontFamily: displayFont,
                    boxShadow: active ? `0 0 16px ${b.color}55` : 'none',
                  }}>{w}</button>
                );
              })}
            </div>
            <div style={{ marginTop: '12px', padding: '11px 13px', background: `${block.color}14`, borderLeft: `3px solid ${block.color}`, borderRadius: '10px' }}>
              <div style={{ fontFamily: displayFont, fontSize: '14px', fontWeight: '700', color: block.color, textTransform: 'uppercase', letterSpacing: '0.04em' }}>{block.label}</div>
              <div style={{ fontSize: '11px', color: '#F4F2F8', marginTop: '3px', fontWeight: '600' }}>{(PHASE[selectedWeek]||{}).name}: {(PHASE[selectedWeek]||{}).variable}</div>
              <div style={{ fontSize: '10px', color: '#908AA0', marginTop: '3px' }}>{rotation ? 'Volume fisso · una sola variabile per settimana' : '3 settimane · solo manubri + panca · mantenimento'}</div>
            </div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
            {DYS.map(d => {
              const completed = isCompleted(selectedWeek, d.id);
              return (
                <button key={d.id} onClick={() => { setSelectedDay(d.id); setView('day'); }} style={{ ...glassCard, display: 'flex', alignItems: 'center', gap: '13px', padding: '14px', textAlign: 'left', cursor: 'pointer', borderLeft: `3px solid ${d.color}`, width: '100%' }}>
                  <div style={{ background: `${d.color}1A`, border: `1px solid ${d.color}44`, padding: '7px 10px', borderRadius: '10px', minWidth: '54px', textAlign: 'center' }}>
                    <div style={{ fontSize: '9px', color: d.color, opacity: 0.8, fontWeight: '700', letterSpacing: '0.06em' }}>{d.dayName}</div>
                    <div style={{ fontFamily: displayFont, fontSize: '17px', color: d.color, fontWeight: '800', lineHeight: 1 }}>{d.label}</div>
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: '13px', color: '#F4F2F8', fontWeight: '600' }}>{d.subtitle}</div>
                    <div style={{ fontSize: '11px', color: '#908AA0', marginTop: '2px' }}>{d.dur}</div>
                  </div>
                  {completed && (
                    <div style={{ background: `${PLATE.green}1F`, border: `1px solid ${PLATE.green}55`, borderRadius: '8px', padding: '4px 8px', display: 'flex', alignItems: 'center', gap: '4px' }}>
                      <Check size={12} color={PLATE.green} />
                      <span style={{ fontSize: '10px', color: PLATE.green, fontWeight: '700' }}>FATTO</span>
                    </div>
                  )}
                  <ChevronRight size={18} color="#5A554D"/>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  const day = DYS.find(d => d.id === selectedDay);
  const exercises = EXS[selectedDay];
  const block = getBlock(selectedWeek);
  const completed = isCompleted(selectedWeek, selectedDay);
  const isRotA = selectedWeek % 2 === 1;

  return (
    <div style={{ minHeight: '100vh', background: 'transparent', paddingBottom: '140px' }}>
      <Header title={`S${selectedWeek} · ${day.dayName} · ${day.label}`} subtitle={`${block.label} · ${day.subtitle}`} onBack={() => setView('select')}/>
      <div style={{ padding: '0 12px' }}>
        {rotation && (
        <div style={{
          background: isRotA ? 'rgba(232, 176, 40, 0.1)' : 'rgba(38, 198, 218, 0.1)',
          border: `1px solid ${isRotA ? 'rgba(232, 176, 40, 0.3)' : 'rgba(38, 198, 218, 0.3)'}`,
          borderRadius: '10px', padding: '8px 12px', marginBottom: '12px',
          fontSize: '11px', color: isRotA ? '#E8B43C' : '#26c6da', textAlign: 'center',
        }}>
          Settimana {selectedWeek} → Rotazione <strong>{isRotA ? 'A (sett 1-3-5-7)' : 'B (sett 2-4-6-8)'}</strong>
        </div>
        )}
        {exercises.map((ex, idx) => {
          const exData = data[selectedWeek]?.[selectedDay]?.esercizi?.[idx] || { kg: '', reps: ['', '', '', ''], rir: '' };
          const logic = applyLogic(ex, selectedWeek);
          const suggested = suggestWeight(ex, selectedWeek, selectedDay, data, idx, PHASE);
          const goalReached = (() => {
            if (!suggested || !exData.kg) return false;
            const targets = parseRepRange(logic.reps);
            const repsArr = (exData.reps || []).map(r => parseInt(r)).filter(r => !isNaN(r) && r > 0);
            return repsArr.length >= logic.sets && repsArr.every(r => r >= targets.max);
          })();
          return (
            <div key={idx} style={{ ...glassCard, padding: '14px', marginBottom: '12px' }}>
              <button onClick={() => setDetailExercise(ex)} style={{ width: '100%', textAlign: 'left', padding: 0, background: 'none', border: 'none', cursor: 'pointer', marginBottom: '10px' }}>
                <ExerciseImage exerciseId={ex.id} tags={ex.tags} height={140}/>
              </button>
              <div style={{ marginBottom: '6px' }}>
                {ex.tags.map(t => <Tag key={t} name={t}/>)}
                {ex.badges.map(b => <Badge key={b} name={b}/>)}
              </div>
              <button onClick={() => setDetailExercise(ex)} style={{ width: '100%', textAlign: 'left', padding: '6px 0', background: 'none', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '8px', marginBottom: '4px' }}>
                <div style={{ fontFamily: displayFont, fontSize: '16px', fontWeight: '700', color: '#F4F2F8', lineHeight: 1.2, flex: 1, letterSpacing: '-0.01em' }}><span style={{ color: day.color }}>{idx + 1}.</span> {ex.name}</div>
                <Info size={15} color={day.color} style={{ flexShrink: 0 }}/>
              </button>
              {ex.shortNote && (
                <div style={{ fontSize: '10px', color: '#908AA0', fontStyle: 'italic', marginBottom: '10px', lineHeight: 1.5, padding: '7px 10px', background: 'rgba(244,242,248,0.03)', borderRadius: '8px', borderLeft: `2px solid ${day.color}66` }}>
                  {ex.shortNote}
                </div>
              )}
              <div style={{ display: 'flex', flexWrap: 'wrap', marginBottom: '12px' }}>
                <MetaPill label="Set" value={logic.sets}/>
                <MetaPill label="Rep" value={logic.reps}/>
                <MetaPill label="RIR" value={logic.rir}/>
                <MetaPill label="Rest" value={logic.rest} IconComp={Timer} color={PLATE.blue}/>
              </div>
              {suggested && !exData.kg && (
                <div style={{ background: `${PLATE.yellow}14`, border: `1px solid ${PLATE.yellow}44`, borderRadius: '10px', padding: '8px 12px', marginBottom: '10px', display: 'flex', alignItems: 'center', gap: '8px', animation: 'pulseGlow 2s infinite' }}>
                  <Lightbulb size={16} color={PLATE.yellow}/>
                  <div style={{ flex: 1, fontSize: '11px', color: '#D9CFE8' }}>
                    Suggerito: <strong style={{ color: PLATE.yellow, fontSize: '14px', fontFamily: displayFont }}>{suggested} kg</strong>
                    {(PHASE[selectedWeek]||{}).load === 'up' && <span style={{ fontSize: '10px', marginLeft: '6px', color: '#D9CFE8' }}>(+carico)</span>}
                  </div>
                  <button onClick={() => updateExercise(selectedWeek, selectedDay, idx, 'kg', suggested)} style={{ background: `${PLATE.yellow}26`, border: `1px solid ${PLATE.yellow}66`, color: PLATE.yellow, fontSize: '11px', fontWeight: '800', padding: '5px 12px', borderRadius: '8px', cursor: 'pointer', fontFamily: displayFont, letterSpacing: '0.04em' }}>USA</button>
                </div>
              )}
              {goalReached && (
                <div style={{ background: `${PLATE.green}14`, border: `1px solid ${PLATE.green}44`, borderRadius: '10px', padding: '8px 12px', marginBottom: '10px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <Check size={16} color={PLATE.green}/>
                  <div style={{ fontSize: '11px', color: '#A8E8C4' }}>
                    <strong style={{ color: PLATE.green }}>Obiettivo raggiunto.</strong> Settimana prossima: +{isLowerBody(ex.tags) ? '5' : '2,5'} kg
                  </div>
                </div>
              )}
              <div style={{ display: 'flex', gap: '8px', marginBottom: '10px' }}>
                <div style={{ flex: '2' }}>
                  <div style={{ fontSize: '9px', textTransform: 'uppercase', color: '#908AA0', marginBottom: '5px', letterSpacing: '0.1em', textAlign: 'center', fontWeight: '600' }}>Kg working</div>
                  <input type="number" inputMode="decimal" step="0.5" placeholder={suggested || '—'} value={exData.kg} onChange={(e) => updateExercise(selectedWeek, selectedDay, idx, 'kg', e.target.value)} style={{ ...inputDark, width: '100%', padding: '10px', fontSize: '17px', fontWeight: '800', color: day.color, border: `1px solid ${day.color}55`, fontFamily: displayFont, boxSizing: 'border-box' }}/>
                </div>
                <div style={{ flex: '1' }}>
                  <div style={{ fontSize: '9px', textTransform: 'uppercase', color: '#908AA0', marginBottom: '5px', letterSpacing: '0.1em', textAlign: 'center', fontWeight: '600' }}>RIR</div>
                  <input type="number" inputMode="numeric" placeholder="—" value={exData.rir} onChange={(e) => updateExercise(selectedWeek, selectedDay, idx, 'rir', e.target.value)} style={{ ...inputDark, width: '100%', padding: '10px', fontSize: '16px', fontWeight: '700', boxSizing: 'border-box' }}/>
                </div>
              </div>
              <div style={{ marginBottom: '10px' }}>
                <div style={{ fontSize: '9px', textTransform: 'uppercase', color: '#908AA0', marginBottom: '6px', letterSpacing: '0.1em', fontWeight: '600', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span>Serie</span>
                  <span style={{ color: '#5A5468', fontWeight: '600', textTransform: 'none', letterSpacing: 0 }}>tap ✓ per partire timer {logic.rest}</span>
                </div>
                {Array.from({ length: logic.sets }).map((_, setIdx) => {
                  const repValue = exData.reps?.[setIdx] || '';
                  const isDone = !!exData.sets_done?.[setIdx];
                  const targets = parseRepRange(logic.reps);
                  const repNum = parseInt(repValue);
                  let borderColor = 'rgba(244,242,248,0.12)';
                  if (!isNaN(repNum) && repNum > 0) {
                    if (repNum >= targets.max) borderColor = `${PLATE.green}88`;
                    else if (repNum >= targets.min) borderColor = `${PLATE.blue}88`;
                    else borderColor = `${PLATE.red}88`;
                  }
                  return (
                    <div key={setIdx} style={{
                      display: 'grid',
                      gridTemplateColumns: '32px 1fr 44px',
                      alignItems: 'center',
                      gap: '8px',
                      padding: '6px 8px',
                      marginBottom: '6px',
                      borderRadius: '10px',
                      background: isDone ? `${PLATE.green}12` : 'rgba(244,242,248,0.02)',
                      border: isDone ? `1px solid ${PLATE.green}40` : '1px solid var(--line)',
                      transition: 'all 0.2s',
                    }}>
                      <div style={{ fontFamily: displayFont, fontSize: '15px', color: isDone ? PLATE.green : day.color, fontWeight: '800', textAlign: 'center' }}>{setIdx + 1}</div>
                      <input
                        type="number"
                        inputMode="numeric"
                        placeholder={String(targets.max)}
                        value={repValue}
                        onChange={(e) => updateExercise(selectedWeek, selectedDay, idx, 'reps', e.target.value, setIdx)}
                        style={{ ...inputDark, width: '100%', padding: '8px 10px', fontSize: '14px', fontWeight: '700', border: `1px solid ${borderColor}`, boxSizing: 'border-box', textAlign: 'center' }}
                      />
                      <button
                        onClick={() => {
                          const willBeDone = !isDone;
                          // Se non ho inserito reps e sto confermando, uso il massimo del range
                          if (willBeDone && (!repValue || repValue === '')) {
                            updateExercise(selectedWeek, selectedDay, idx, 'reps', String(targets.max), setIdx);
                          }
                          updateExercise(selectedWeek, selectedDay, idx, 'sets_done', willBeDone, setIdx);
                          if (willBeDone) {
                            startTimer(parseRestSeconds(logic.rest), `${ex.name} S${setIdx+1}`);
                            try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}
                          }
                        }}
                        style={{
                          width: '40px', height: '38px', borderRadius: '10px',
                          background: isDone ? PLATE.green : 'rgba(244,242,248,0.05)',
                          border: isDone ? `1px solid ${PLATE.green}` : '1px solid rgba(244,242,248,0.12)',
                          color: isDone ? '#100F0D' : '#5A5468',
                          cursor: 'pointer',
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          boxShadow: isDone ? '0 0 12px rgba(47, 164, 92, 0.4)' : 'none',
                          transition: 'all 0.2s',
                        }}
                        aria-label={isDone ? 'Annulla serie' : 'Conferma serie e avvia timer'}
                      >
                        <Check size={18}/>
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
        <button onClick={() => toggleComplete(selectedWeek, selectedDay)} style={{ width: '100%', padding: '16px', marginTop: '8px', background: completed ? 'linear-gradient(135deg, #3FB66C 0%, #2E8F54 100%)' : 'linear-gradient(135deg, #4D82E8 0%, #1e88e5 100%)', color: 'white', border: 'none', borderRadius: '14px', fontSize: '14px', fontWeight: '700', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', boxShadow: '0 4px 12px rgba(0,0,0,0.3)' }}>
          {completed ? <><Check size={18} /> Sessione completata</> : <><Save size={18} /> Segna come completato</>}
        </button>
      </div>
    </div>
  );
}
// ============= PESO =============

function PesoScreen({ goBack }) {
  const [data, setData] = useState({});
  const [pesoIniziale, setPesoIniziale] = useState(92);
  const [misure, setMisure] = useState({});
  const [foto, setFoto] = useState({});
  const [tab, setTab] = useState('peso');

  useEffect(() => {
    setData(storage.get('peso') || {});
    const init = storage.get('pesoIniziale');
    if (init) setPesoIniziale(init);
    setMisure(storage.get('misure') || {});
    setFoto(storage.get('foto') || {});
  }, []);

  const updatePeso = (week, day, value) => {
    const newData = JSON.parse(JSON.stringify(data));
    if (!newData[week]) newData[week] = { lun: '', mer: '', ven: '', dom: '', media: 0, note: '' };
    newData[week][day] = value;
    const days = ['lun', 'mer', 'ven', 'dom'];
    const valori = days.map(d => parseFloat(newData[week][d])).filter(v => !isNaN(v) && v > 0);
    newData[week].media = valori.length > 0 ? valori.reduce((a,b)=>a+b,0) / valori.length : 0;
    setData(newData); storage.set('peso', newData);
  };
  const updateNote = (week, value) => {
    const newData = JSON.parse(JSON.stringify(data));
    if (!newData[week]) newData[week] = { lun: '', mer: '', ven: '', dom: '', media: 0, note: '' };
    newData[week].note = value;
    setData(newData); storage.set('peso', newData);
  };
  const updatePesoIniziale = (value) => { const v = parseFloat(value) || 92; setPesoIniziale(v); storage.set('pesoIniziale', v); };
  const updateMisura = (block, point, value) => {
    const newM = { ...misure };
    if (!newM[block]) newM[block] = {};
    newM[block][point] = value;
    setMisure(newM); storage.set('misure', newM);
  };
  const toggleFoto = (key) => { const newF = { ...foto, [key]: !foto[key] }; setFoto(newF); storage.set('foto', newF); };
  const getDelta = (week) => {
    if (!data[week]?.media) return null;
    if (week === 1) return data[week].media - pesoIniziale;
    if (data[week-1]?.media) return data[week].media - data[week-1].media;
    return null;
  };
  const getStatusColor = (delta) => {
    if (delta === null) return '#908AA0';
    if (delta <= -0.5 && delta >= -0.8) return '#3FB66C';
    if (delta < -0.8) return '#E8B43C';
    if (delta > 0.3) return '#E0524A';
    return '#908AA0';
  };
  const punti = ['Vita ombelicale', 'Petto', 'Coscia (max)', 'Polpaccio', 'Braccio (flesso)', 'Avambraccio'];

  return (
    <div style={{ minHeight: '100vh', background: 'transparent', paddingBottom: '120px' }}>
      <Header title="Peso & Misure" onBack={goBack}/>
      <div style={{ ...glassCard, margin: '0 12px 14px 12px', padding: '6px', display: 'flex' }}>
        {[{ id: 'peso', label: 'Peso 4×/sett' }, { id: 'misure', label: 'Misure' }, { id: 'foto', label: 'Foto' }].map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ flex: 1, padding: '10px 4px', border: 'none', background: tab === t.id ? 'linear-gradient(135deg, #4D82E8 0%, #1e88e5 100%)' : 'transparent', color: tab === t.id ? 'white' : '#908AA0', fontSize: '12px', fontWeight: tab === t.id ? '700' : '500', cursor: 'pointer', borderRadius: '10px' }}>{t.label}</button>
        ))}
      </div>
      <div style={{ padding: '0 12px' }}>
        {tab === 'peso' && (<>
          <div style={{ ...glassCard, padding: '16px', marginBottom: '14px' }}>
            <div style={{ fontSize: '11px', color: '#908AA0', textTransform: 'uppercase', letterSpacing: '0.6px', marginBottom: '8px' }}>Peso iniziale</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              <input type="number" inputMode="decimal" step="0.1" value={pesoIniziale} onChange={(e) => updatePesoIniziale(e.target.value)} style={{ ...inputDark, width: '110px', padding: '10px', fontSize: '20px', fontWeight: '700', color: '#4D82E8', border: '1px solid rgba(60, 111, 223, 0.4)' }}/>
              <span style={{ fontSize: '14px', color: '#908AA0' }}>kg</span>
            </div>
          </div>
          {[1,2,3,4,5,6,7,8].map(w => {
            const wd = data[w] || { lun: '', mer: '', ven: '', dom: '', media: 0, note: '' };
            const delta = getDelta(w);
            return (
              <div key={w} style={{ ...glassCard, padding: '14px', marginBottom: '10px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                  <div style={{ fontSize: '13px', fontWeight: '700', color: '#4D82E8' }}>SETTIMANA {w}</div>
                  {wd.media > 0 && (
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                      {delta !== null && <span style={{ color: getStatusColor(delta), fontWeight: '700', fontSize: '12px' }}>{delta > 0 ? '+' : ''}{delta.toFixed(1)}</span>}
                      <span style={{ fontWeight: '700', color: '#F4F2F8', fontSize: '14px' }}>{wd.media.toFixed(1)} kg</span>
                    </div>
                  )}
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '6px', marginBottom: '8px' }}>
                  {['lun','mer','ven','dom'].map(d => (
                    <div key={d}>
                      <div style={{ fontSize: '9px', textTransform: 'uppercase', color: '#908AA0', textAlign: 'center', marginBottom: '3px' }}>{d}</div>
                      <input type="number" inputMode="decimal" step="0.1" value={wd[d]} onChange={(e) => updatePeso(w, d, e.target.value)} placeholder="—" style={{ ...inputDark, width: '100%', padding: '8px 2px', fontSize: '13px', boxSizing: 'border-box', fontWeight: '600' }}/>
                    </div>
                  ))}
                </div>
                <input type="text" placeholder="Note..." value={wd.note} onChange={(e) => updateNote(w, e.target.value)} style={{ ...inputDark, width: '100%', padding: '8px', fontSize: '11px', textAlign: 'left', boxSizing: 'border-box' }}/>
              </div>
            );
          })}
        </>)}
        {tab === 'misure' && (<>
          <div style={{ fontSize: '11px', color: '#908AA0', marginBottom: '14px', padding: '12px', background: 'rgba(232, 176, 40, 0.1)', borderLeft: '3px solid #E8B43C', borderRadius: '8px' }}>Misura ogni 4 settimane (fine blocco). Centimetri.</div>
          {['INIZIO', 'FINE BL.A (S3)', 'FINE BL.B (S6)', 'FINE BL.C (S8)'].map(b => (
            <div key={b} style={{ ...glassCard, padding: '14px', marginBottom: '10px' }}>
              <div style={{ fontSize: '12px', fontWeight: '700', color: '#4D82E8', marginBottom: '12px' }}>{b}</div>
              {punti.map(p => (
                <div key={p} style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '8px' }}>
                  <div style={{ flex: 1, fontSize: '12px', color: '#e8e8f0' }}>{p}</div>
                  <input type="number" inputMode="decimal" step="0.1" value={misure[b]?.[p] || ''} onChange={(e) => updateMisura(b, p, e.target.value)} placeholder="—" style={{ ...inputDark, width: '80px', padding: '8px', fontSize: '12px', fontWeight: '600' }}/>
                  <span style={{ fontSize: '10px', color: '#908AA0' }}>cm</span>
                </div>
              ))}
            </div>
          ))}
        </>)}
        {tab === 'foto' && (<>
          <div style={{ fontSize: '11px', color: '#908AA0', marginBottom: '14px', padding: '12px', background: 'rgba(232, 176, 40, 0.1)', borderLeft: '3px solid #E8B43C', borderRadius: '8px', lineHeight: 1.6 }}>
            <strong style={{ color: '#E8B43C' }}>Come fare le foto:</strong> 3 angoli (frontale/laterale/dorso). Stessa luce, stessa ora, stesso pasto giorno prima.
          </div>
          {[{ id: 'inizio', label: 'Inizio (S1)' },{ id: 'fineA', label: 'Fine Blocco A (S4)' },{ id: 'fineB', label: 'Fine Blocco B (S7)' },{ id: 'fineC', label: 'Fine Blocco C (S9)' }].map(f => (
            <button key={f.id} onClick={() => toggleFoto(f.id)} style={{ ...glassCard, width: '100%', padding: '16px', marginBottom: '10px', background: foto[f.id] ? 'linear-gradient(135deg, rgba(47, 164, 92, 0.25) 0%, rgba(47, 164, 92, 0.1) 100%)' : glassCard.background, border: foto[f.id] ? '1px solid rgba(47, 164, 92, 0.5)' : glassCard.border, color: '#F4F2F8', fontSize: '13px', fontWeight: '600', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '14px' }}>
              {foto[f.id] ? <Check size={22} color="#3FB66C"/> : <Camera size={22} color="#888"/>}
              <span style={{ flex: 1, textAlign: 'left' }}>{f.label}</span>
              {foto[f.id] && <span style={{ fontSize: '11px', color: '#3FB66C', fontWeight: '700' }}>FATTE ✓</span>}
            </button>
          ))}
        </>)}
      </div>
    </div>
  );
}

// ============= DASHBOARD =============

function DashboardScreen({ goBack }) {
  const [workouts, setWorkouts] = useState({});
  const [pesoData, setPesoData] = useState({});
  const [pesoIniziale, setPesoIniziale] = useState(92);

  useEffect(() => {
    setWorkouts(storage.get('workouts') || {});
    setPesoData(storage.get('peso') || {});
    setPesoIniziale(storage.get('pesoIniziale') || 92);
  }, []);

  const get1RM = (compound) => {
    const result = {};
    [1, 4, 7, 8].forEach(week => {
      const ex = workouts[week]?.[compound.day]?.esercizi?.[compound.idx];
      if (ex && ex.kg && ex.reps?.[0]) {
        const kg = parseFloat(ex.kg);
        const reps = parseFloat(ex.reps[0]);
        if (!isNaN(kg) && !isNaN(reps) && kg > 0 && reps > 0) result[week] = kg * (1 + reps / 30);
      }
    });
    return result;
  };

  const ultimaSett = Object.entries(pesoData).filter(([_, v]) => v.media > 0).sort((a,b) => parseInt(a[0]) - parseInt(b[0])).slice(-1)[0];
  const pesoAttuale = ultimaSett ? ultimaSett[1].media : pesoIniziale;
  const perditaTot = pesoAttuale - pesoIniziale;
  let sessioniTot = 0;
  Object.values(workouts).forEach(w => Object.values(w).forEach(d => { if (d?.completato) sessioniTot++; }));

  return (
    <div style={{ minHeight: '100vh', background: 'transparent', paddingBottom: '120px' }}>
      <Header title="Dashboard" subtitle="Progressi del ciclo" onBack={goBack}/>
      <div style={{ padding: '0 12px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '14px' }}>
          {[
            { label: 'Iniziale', value: pesoIniziale.toFixed(1), unit: 'kg', color: '#A855F7' },
            { label: 'Attuale', value: pesoAttuale.toFixed(1), unit: 'kg', color: '#4D82E8' },
            { label: 'Δ Totale', value: (perditaTot > 0 ? '+' : '') + perditaTot.toFixed(1), unit: 'kg', color: perditaTot < 0 ? '#3FB66C' : '#E0524A' },
            { label: 'Sessioni', value: sessioniTot, unit: '/ 40', color: '#E8B43C' },
          ].map((stat, i) => (
            <div key={i} style={{ ...glassCard, padding: '14px', textAlign: 'center' }}>
              <div style={{ fontSize: '9px', color: '#908AA0', textTransform: 'uppercase', letterSpacing: '0.6px' }}>{stat.label}</div>
              <div style={{ fontSize: '24px', fontWeight: '700', color: stat.color, marginTop: '4px' }}>{stat.value}</div>
              <div style={{ fontSize: '10px', color: '#908AA0' }}>{stat.unit}</div>
            </div>
          ))}
        </div>
        <div style={{ ...glassCard, padding: '16px', marginBottom: '14px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px' }}>
            <Dumbbell size={16} color="#A855F7"/>
            <div style={{ fontSize: '13px', fontWeight: '700', color: '#F4F2F8' }}>1RM Stimato (Epley)</div>
          </div>
          <div style={{ fontSize: '10px', color: '#908AA0', marginBottom: '12px' }}>1RM = peso × (1 + reps/30). Affidabile 3-10 rep.</div>
          {COMPOUNDS.slice(0, 5).map((c, i) => {
            const r = get1RM(c);
            const ini = r[1], finA = r[4], finC = r[8];
            return (
              <div key={i} style={{ borderBottom: i < 4 ? '1px solid rgba(255,255,255,0.06)' : 'none', padding: '10px 0' }}>
                <div style={{ fontSize: '12px', fontWeight: '600', color: '#F4F2F8', marginBottom: '6px' }}>{c.name}</div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '6px' }}>
                  {[{ label: 'S1', val: ini },{ label: 'S4', val: finA },{ label: 'S8', val: finC }].map(b => (
                    <div key={b.label} style={{ textAlign: 'center', background: 'rgba(155, 93, 229, 0.1)', border: '1px solid rgba(155, 93, 229, 0.2)', padding: '6px 4px', borderRadius: '8px' }}>
                      <div style={{ fontSize: '8px', color: '#908AA0', textTransform: 'uppercase' }}>{b.label}</div>
                      <div style={{ fontSize: '13px', fontWeight: '700', color: '#A855F7' }}>{b.val ? b.val.toFixed(1) : '—'}</div>
                    </div>
                  ))}
                  {ini && finC ? (
                    <div style={{ textAlign: 'center', background: finC > ini ? 'rgba(47, 164, 92, 0.15)' : 'rgba(210, 59, 46, 0.15)', border: `1px solid ${finC > ini ? 'rgba(47, 164, 92, 0.3)' : 'rgba(210, 59, 46, 0.3)'}`, padding: '6px 4px', borderRadius: '8px' }}>
                      <div style={{ fontSize: '8px', color: '#908AA0', textTransform: 'uppercase' }}>Δ</div>
                      <div style={{ fontSize: '13px', fontWeight: '700', color: finC > ini ? '#3FB66C' : '#E0524A' }}>{finC > ini ? '+' : ''}{(finC - ini).toFixed(1)}</div>
                    </div>
                  ) : (
                    <div style={{ textAlign: 'center', padding: '6px 4px', borderRadius: '8px', background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.05)' }}>
                      <div style={{ fontSize: '8px', color: '#908AA0', textTransform: 'uppercase' }}>Δ</div>
                      <div style={{ fontSize: '13px', color: '#5A5468' }}>—</div>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ ...glassCard, padding: '16px', marginBottom: '14px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '12px' }}>
            <Scale size={16} color="#4D82E8"/>
            <div style={{ fontSize: '13px', fontWeight: '700', color: '#F4F2F8' }}>Andamento peso settimanale</div>
          </div>
          {[1,2,3,4,5,6,7,8].map(w => {
            const wd = pesoData[w];
            if (!wd?.media) return (
              <div key={w} style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '8px 0', borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
                <div style={{ fontSize: '11px', fontWeight: '700', width: '30px', color: '#5A5468' }}>S{w}</div>
                <div style={{ flex: 1, fontSize: '11px', color: '#444' }}>—</div>
              </div>
            );
            const prev = pesoData[w-1]?.media || pesoIniziale;
            const delta = wd.media - prev;
            let statusColor = '#908AA0', statusText = '○';
            if (delta <= -0.5 && delta >= -0.8) { statusColor = '#3FB66C'; statusText = '✓'; }
            else if (delta < -0.8) { statusColor = '#E8B43C'; statusText = '⚠'; }
            else if (delta > 0.3) { statusColor = '#E0524A'; statusText = '⚠'; }
            const I = delta < -0.1 ? TrendingDown : delta > 0.1 ? TrendingUp : Minus;
            const iconColor = delta < -0.1 ? '#3FB66C' : delta > 0.1 ? '#E0524A' : '#908AA0';
            return (
              <div key={w} style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '8px 0', borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
                <div style={{ fontSize: '11px', fontWeight: '700', width: '30px', color: '#908AA0' }}>S{w}</div>
                <I size={14} color={iconColor}/>
                <div style={{ flex: 1, fontSize: '13px', fontWeight: '700', color: '#F4F2F8' }}>{wd.media.toFixed(1)} kg</div>
                <div style={{ fontSize: '11px', color: iconColor, fontWeight: '700', width: '50px', textAlign: 'right' }}>{delta > 0 ? '+' : ''}{delta.toFixed(1)}</div>
                <div style={{ fontSize: '14px', color: statusColor, width: '20px', textAlign: 'center' }}>{statusText}</div>
              </div>
            );
          })}
          <div style={{ fontSize: '9px', color: '#908AA0', marginTop: '10px', lineHeight: 1.6 }}>
            ✓ optimal (-0.5/-0.8) · ⚠ troppo veloce o no progress · ○ lento
          </div>
        </div>
      </div>
    </div>
  );
}

function RecoveryScreen({ goBack }) {
  const [data, setData] = useState({});

    const newData = JSON.parse(JSON.stringify(data));
    if (!newData[week]) newData[week] = { sonno: '', energia: '', recupero: '', stress: '', note: '' };
    newData[week][field] = value;
    setData(newData);
    storage.set('recovery', newData);
  };
  return (
    <div style={{ minHeight: '100vh', background: 'transparent', paddingBottom: '120px' }}>
      <Header title="Recovery & Sonno" onBack={goBack}/>
      <div style={{ padding: '0 12px' }}>
        <div style={{ fontSize: '11px', color: '#908AA0', marginBottom: '14px', padding: '12px', background: 'rgba(232, 176, 40, 0.1)', borderLeft: '3px solid #E8B43C', borderRadius: '8px', lineHeight: 1.6 }}>

          const wd = data[w] || { sonno: '', energia: '', recupero: '', stress: '', note: '' };

                  <div key={field.f}>
                    <div style={{ fontSize: '9px', textTransform: 'uppercase', color: '#908AA0', marginBottom: '4px' }}>{field.label}</div>

                  </div>

function SettingsScreen({ goBack }) {
  const [msg, setMsg] = useState(null);
  const fileInputRef = useRef(null);
  const exportData = () => {
    const data = storage.exportAll();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const date = new Date().toISOString().split('T')[0];
    a.download = `v8tracker-backup-${date}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setMsg({ type: 'success', text: 'Backup scaricato!' });
    setTimeout(() => setMsg(null), 3000);
  };
  const importData = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (confirm('Importare i dati? Sovrascriverà i dati attuali.')) {
          storage.importAll(data);
          setMsg({ type: 'success', text: 'Dati importati! Ricarica la pagina.' });
          setTimeout(() => window.location.reload(), 1500);
        }
      } catch (err) {
        setMsg({ type: 'error', text: 'File non valido.' });
        setTimeout(() => setMsg(null), 3000);
      }
    };
    reader.readAsText(file);
  };
  const clearAll = () => {
    if (confirm('CANCELLARE TUTTI I DATI?')) {
      if (confirm('Sei davvero sicuro?')) {
        storage.clearAll();
        setMsg({ type: 'success', text: 'Dati cancellati.' });
        setTimeout(() => window.location.reload(), 1000);
      }
    }
  };
  return (
    <div style={{ minHeight: '100vh', background: 'transparent', paddingBottom: '120px' }}>
      <Header title="Impostazioni & Backup" onBack={goBack}/>
      <div style={{ padding: '0 12px' }}>
        {msg && (
          <div style={{ padding: '10px 14px', marginBottom: '14px', borderRadius: '10px', background: msg.type === 'success' ? 'rgba(47, 164, 92, 0.2)' : 'rgba(210, 59, 46, 0.2)', border: `1px solid ${msg.type === 'success' ? '#3FB66C' : '#E0524A'}`, color: msg.type === 'success' ? '#3FB66C' : '#E0524A', fontSize: '12px', fontWeight: '600' }}>{msg.text}</div>
        )}
        <div style={{ ...glassCard, padding: '16px', marginBottom: '14px' }}>
          <div style={{ fontSize: '13px', fontWeight: '700', color: '#F4F2F8', marginBottom: '8px' }}>Backup dati</div>
          <div style={{ fontSize: '11px', color: '#908AA0', lineHeight: 1.5, marginBottom: '14px' }}>Tutti i dati sono salvati nel browser. Esporta periodicamente un backup JSON per non perderli.</div>
          <button onClick={exportData} style={{ width: '100%', padding: '14px', marginBottom: '10px', background: 'linear-gradient(135deg, #3FB66C 0%, #2E8F54 100%)', color: 'white', border: 'none', borderRadius: '12px', fontSize: '13px', fontWeight: '700', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}><Download size={16}/> Esporta backup JSON</button>
          <input ref={fileInputRef} type="file" accept="application/json" onChange={importData} style={{ display: 'none' }}/>
          <button onClick={() => fileInputRef.current?.click()} style={{ width: '100%', padding: '14px', background: 'linear-gradient(135deg, #4D82E8 0%, #1e88e5 100%)', color: 'white', border: 'none', borderRadius: '12px', fontSize: '13px', fontWeight: '700', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}><Upload size={16}/> Importa backup</button>
        </div>
        <div style={{ ...glassCard, padding: '16px', marginBottom: '14px', borderLeft: '3px solid #E0524A' }}>
          <div style={{ fontSize: '13px', fontWeight: '700', color: '#E0524A', marginBottom: '8px' }}>Zona pericolo</div>
          <div style={{ fontSize: '11px', color: '#908AA0', lineHeight: 1.5, marginBottom: '14px' }}>Cancella tutti i dati. Operazione irreversibile.</div>
          <button onClick={clearAll} style={{ width: '100%', padding: '14px', background: 'rgba(210, 59, 46, 0.2)', color: '#E0524A', border: '1px solid rgba(210, 59, 46, 0.5)', borderRadius: '12px', fontSize: '13px', fontWeight: '700', cursor: 'pointer' }}>Cancella tutti i dati</button>
        </div>
        <div style={{ ...glassCard, padding: '16px' }}>
          <div style={{ fontSize: '13px', fontWeight: '700', color: '#F4F2F8', marginBottom: '8px' }}>Info app</div>

// Logica progressione estiva (riusa il motore, con SUMMER_PHASE)
const summerApplyLogic = (exercise, week) => {
  let { sets, reps, isCompound } = exercise;
  const phase = SUMMER_PHASE[week] || SUMMER_PHASE[1];
  const rir = isCompound ? phase.compRir : phase.accRir;
  let outReps = reps;
  if (!reps.includes('+') && !reps.includes('AMRAP')) outReps = repTargetForPhase(reps, phase.repPos);
  return { sets, reps: outReps, rir, blockName: phase.name, variable: phase.variable, loadCue: phase.load };
};

// ============================================================
// DATABASE ESERCIZI (lookup piatto per ID) + IMPORTAZIONE SCHEDE .v8w
// Derivato dai pool esistenti: nessun contenuto duplicato.
// ============================================================
const EXERCISE_DB = {};
[EXERCISES, SUMMER_EXERCISES, SUMMER2_EXERCISES].forEach(group => {
  Object.values(group).forEach(list => { list.forEach(ex => { EXERCISE_DB[ex.id] = ex; }); });
});

// Fase di default per una scheda importata che non ne porta una propria.
const DEFAULT_V8W_PHASE = {
  1: { name: 'SETT. 1', variable: 'Stabilisci i carichi', repPos: 'bottom', compRir: '2', accRir: '1', load: 'base' },
  2: { name: 'SETT. 2', variable: '+1 rep · carico fermo', repPos: 'mid', compRir: '1-2', accRir: '0-1', load: 'hold' },
  3: { name: 'SETT. 3', variable: '+1 rep → top range', repPos: 'top', compRir: '1', accRir: '0-1', load: 'hold' },
};

// Risolve un elemento exercises[] (stringa-ID | {ref,override} | {inline}) in esercizio completo.
const resolveV8wExercise = (item, localDb) => {
  if (typeof item === 'string') {
    const base = (localDb && localDb[item]) || EXERCISE_DB[item];
    return base ? { ...base } : null;
  }
  if (item && item.inline) return { ...item.inline };
  if (item && item.ref) {
    const base = (localDb && localDb[item.ref]) || EXERCISE_DB[item.ref];
    if (!base) return null;
    const out = { ...base };
    ['sets', 'reps', 'rir', 'rest'].forEach(k => { if (item[k] != null) out[k] = item[k]; });
    return out;
  }
  return null;
};

// Valida uno schema .v8w. Ritorna null se ok, altrimenti un messaggio d'errore.
const validateV8w = (obj) => {
  if (!obj || typeof obj !== 'object') return 'File non valido.';
  if (!Array.isArray(obj.days) || obj.days.length === 0) return 'Manca la lista "days" (i giorni).';
  for (const d of obj.days) {
    if (!d || !Array.isArray(d.exercises) || d.exercises.length === 0) return 'Un giorno non ha esercizi.';
  }
  return null;
};

// "Gonfia" una scheda leggera .v8w in un config completo per WorkoutScreen.
const rehydrateSchedule = (v8w) => {
  const localDb = {};
  if (v8w.newExercises) Object.entries(v8w.newExercises).forEach(([id, def]) => { localDb[id] = { id, ...def }; });
  const phase = (v8w.phase && typeof v8w.phase === 'object') ? v8w.phase : DEFAULT_V8W_PHASE;
  const weeksArr = Array.isArray(v8w.weeks)
    ? v8w.weeks
    : Array.from({ length: v8w.weeks || Object.keys(phase).length || 3 }, (_, i) => i + 1);
  const days = [];
  const exercises = {};
  (v8w.days || []).forEach((d, di) => {
    const dayId = d.id || ('d' + di);
    days.push({ id: dayId, label: d.label || ('G' + (di + 1)), dayName: d.dayName || '', color: d.color || '#4D82E8', subtitle: d.subtitle || '', dur: d.dur || '' });
    exercises[dayId] = (d.exercises || []).map((it, ei) => {
      const ex = resolveV8wExercise(it, localDb);
      if (!ex) return null;
      if (!ex.id) ex.id = dayId + '_' + ei;
      if (!Array.isArray(ex.tags)) ex.tags = [];
      if (!Array.isArray(ex.badges)) ex.badges = [];
      if (ex.sets == null) ex.sets = 3;
      if (ex.reps == null) ex.reps = '8-12';
      if (ex.rir == null) ex.rir = '1-2';
      if (ex.rest == null) ex.rest = '90s';
      return ex;
    }).filter(Boolean);
  });
  return {
    exercises, days, phase,
    blocks: v8w.blocks || [{ id: 'X', label: v8w.name || 'Scheda importata', weeks: weeksArr, color: '#A855F7', reps: '', rir: '' }],
    applyLogic: makeApplyLogic(phase),
    suggestWeight: getSuggestedWeight,
    storageKey: v8w.storageKey || ('sched_' + (v8w.id || 'custom')),
    weeks: weeksArr,
    rotation: !!v8w.rotation,
  };
};

function LibraryScreen({ goBack }) {
  const [schedules, setSchedules] = useState(() => storage.get('custom_schedules') || []);
  const [selected, setSelected] = useState(null);
  const [panel, setPanel] = useState(false);
  const [paste, setPaste] = useState('');
  const [msg, setMsg] = useState(null);
  const fileRef = useRef(null);

  const persist = (list) => { setSchedules(list); storage.set('custom_schedules', list); };

  const importText = (raw) => {
    let obj;
    try { obj = JSON.parse(raw); } catch (e) { setMsg({ ok: false, text: 'JSON non valido: ' + e.message }); return; }
    const err = validateV8w(obj);
    if (err) { setMsg({ ok: false, text: err }); return; }
    if (!obj.id) obj.id = 'sched_' + Date.now();
    if (!obj.storageKey) obj.storageKey = 'sched_' + obj.id;
    const list = schedules.filter(s => s.id !== obj.id).concat([obj]);
    persist(list);
    setMsg({ ok: true, text: 'Scheda "' + (obj.name || obj.id) + '" importata.' });
    setPaste(''); setPanel(false);
  };

  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => importText(String(r.result));
    r.onerror = () => setMsg({ ok: false, text: 'Impossibile leggere il file.' });
    r.readAsText(f);
    e.target.value = '';
  };

  const openSchedule = (s) => { try { setSelected(rehydrateSchedule(s)); } catch (e) { setMsg({ ok: false, text: 'Errore apertura: ' + e.message }); } };
  const remove = (id) => persist(schedules.filter(s => s.id !== id));

  if (selected) return <WorkoutScreen goBack={() => setSelected(null)} config={selected} />;

  return (
    <div style={{ minHeight: '100vh', background: 'transparent', paddingBottom: '120px' }}>
      <Header title="Le mie schede" subtitle="Importa e gestisci schede (.v8w)" onBack={goBack} />
      <div style={{ padding: '0 12px' }}>
        <button onClick={() => { setPanel(!panel); setMsg(null); }} style={{ width: '100%', padding: '15px', marginBottom: '12px', background: panel ? 'rgba(168,85,247,0.15)' : 'linear-gradient(135deg, #A855F7 0%, #7C3AED 100%)', color: panel ? '#A855F7' : 'white', border: panel ? '1px solid rgba(168,85,247,0.4)' : 'none', borderRadius: '16px', fontSize: '14px', fontWeight: '700', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '9px' }}>
          {panel ? <XIcon size={18} /> : <Plus size={18} />} {panel ? 'Chiudi' : 'Importa scheda'}
        </button>

        {panel && (
          <div style={{ ...glassCard, padding: '14px', marginBottom: '14px' }}>
            <input ref={fileRef} type="file" accept=".v8w,.json,application/json" onChange={onFile} style={{ display: 'none' }} />
            <button onClick={() => fileRef.current && fileRef.current.click()} style={{ width: '100%', padding: '12px', marginBottom: '10px', background: 'rgba(77,130,232,0.15)', border: '1px solid rgba(77,130,232,0.4)', color: '#4D82E8', borderRadius: '12px', fontSize: '13px', fontWeight: '700', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}>
              <Upload size={16} /> Carica file .v8w / .json
            </button>
            <div style={{ fontSize: '10px', color: '#908AA0', textAlign: 'center', margin: '2px 0 10px' }}>oppure incolla il codice qui sotto</div>
            <textarea value={paste} onChange={(e) => setPaste(e.target.value)} placeholder={'{ "format": "v8w/1", "name": "...", "days": [ ... ] }'} style={{ ...inputDark, width: '100%', minHeight: '110px', fontFamily: 'monospace', fontSize: '11px', color: '#F4F2F8', padding: '10px', borderRadius: '10px', resize: 'vertical', boxSizing: 'border-box' }} />
            <button onClick={() => importText(paste)} disabled={!paste.trim()} style={{ width: '100%', marginTop: '10px', padding: '12px', background: paste.trim() ? 'linear-gradient(135deg, #3FB66C 0%, #2E8B57 100%)' : 'rgba(255,255,255,0.06)', color: paste.trim() ? 'white' : '#5A5468', border: 'none', borderRadius: '12px', fontSize: '13px', fontWeight: '700', cursor: paste.trim() ? 'pointer' : 'default', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}>
              <Check size={16} /> Importa dal testo
            </button>
          </div>
        )}

        {msg && (
          <div style={{ background: msg.ok ? 'rgba(63,182,108,0.14)' : 'rgba(224,82,74,0.14)', border: '1px solid ' + (msg.ok ? 'rgba(63,182,108,0.4)' : 'rgba(224,82,74,0.4)'), borderRadius: '12px', padding: '11px 13px', marginBottom: '14px', fontSize: '12px', color: msg.ok ? '#3FB66C' : '#E0524A', lineHeight: 1.5 }}>
            {msg.text}
          </div>
        )}

        {schedules.length === 0 && !panel && (
          <div style={{ ...glassCard, padding: '22px 16px', textAlign: 'center', marginBottom: '14px' }}>
            <Layers size={30} color="#5A5468" />
            <div style={{ fontSize: '13px', color: '#C7C2D0', fontWeight: '600', marginTop: '10px' }}>Nessuna scheda importata</div>
            <div style={{ fontSize: '11px', color: '#908AA0', marginTop: '6px', lineHeight: 1.5 }}>Tocca "Importa scheda" per aggiungere una scheda in formato .v8w. Le schede integrate (Allenamento, Estate) restano nella home.</div>
          </div>
        )}

        {schedules.map(s => {
          const nGiorni = Array.isArray(s.days) ? s.days.length : 0;
          const col = (s.blocks && s.blocks[0] && s.blocks[0].color) || '#A855F7';
          return (
            <div key={s.id} style={{ ...glassCard, padding: '13px', marginBottom: '10px', borderLeft: '3px solid ' + col }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '11px' }}>
                <div style={{ background: col + '22', border: '1px solid ' + col + '44', width: '40px', height: '40px', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                  <Layers size={18} color={col} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: displayFont, fontSize: '14px', fontWeight: '700', color: '#F4F2F8', lineHeight: 1.2 }}>{s.name || 'Scheda'}</div>
                  <div style={{ fontSize: '10px', color: '#908AA0', marginTop: '3px' }}>{s.subtitle ? s.subtitle + ' · ' : ''}{nGiorni} giorni</div>
                </div>
                <button onClick={() => remove(s.id)} style={{ background: 'rgba(224,82,74,0.12)', border: '1px solid rgba(224,82,74,0.3)', borderRadius: '10px', width: '34px', height: '34px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', flexShrink: 0 }}>
                  <Trash2 size={15} color="#E0524A" />
                </button>
              </div>
              <button onClick={() => openSchedule(s)} style={{ width: '100%', marginTop: '11px', padding: '11px', background: 'linear-gradient(135deg, ' + col + ' 0%, ' + col + 'cc 100%)', color: 'white', border: 'none', borderRadius: '11px', fontSize: '13px', fontWeight: '700', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}>
                <Dumbbell size={16} /> Apri allenamento
              </button>
            </div>
          );
        })}

        <div style={{ fontSize: '10px', color: '#5A5468', textAlign: 'center', marginTop: '18px', lineHeight: 1.6 }}>
          Formato .v8w: JSON con "days" (i giorni) ed esercizi per ID (dal database) o inline.<br />Le schede importate salvano i log separatamente.
        </div>
      </div>
    </div>
  );
}

// Error boundary: un errore runtime in un componente non deve più
// produrre uno schermo bianco. I dati restano al sicuro in localStorage.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { try { console.error('V8 Tracker error:', error, info); } catch (e) {} }
  render() {
    if (this.state.error) {
      return (
        <div style={{ minHeight: '100vh', background: '#0a0e1a', color: '#F4F2F8', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '24px', textAlign: 'center', fontFamily: 'system-ui, sans-serif' }}>
          <div style={{ fontSize: '42px', marginBottom: '12px' }}>⚠️</div>
          <div style={{ fontSize: '17px', fontWeight: 700, marginBottom: '8px' }}>Qualcosa è andato storto</div>
          <div style={{ fontSize: '12px', color: '#908AA0', marginBottom: '20px', lineHeight: 1.5 }}>I tuoi dati sono al sicuro in locale.<br/>Ricarica l'app per continuare.</div>
          <button onClick={() => window.location.reload()} style={{ padding: '13px 28px', borderRadius: '12px', border: 'none', background: 'linear-gradient(135deg, #4D82E8, #1e88e5)', color: '#F4F2F8', fontWeight: 700, fontSize: '14px', cursor: 'pointer' }}>Ricarica</button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><BackStackProvider><TechModalProvider><App/></TechModalProvider></BackStackProvider></ErrorBoundary>);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
