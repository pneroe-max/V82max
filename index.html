// Hook per gestire il tasto indietro hardware Android.
// Ogni schermata interna chiama useAndroidBack(goBack), che:
//  1) al mount, fa history.pushState (così c'è un entry da poppare)
//  2) ascolta popstate: quando l'utente preme back, chiama goBack()
//  3) al unmount, rimuove il listener
// BackStack globale: LIFO di handler. Il TOP riceve il prossimo back.
// Schermate interne e modal pushano un handler quando si aprono e lo poppano quando si chiudono.
// Un solo listener popstate a livello globale, niente race condition.
const BackStackContext = createContext(null);

function BackStackProvider({ children }) {
  const stackRef = useRef([]); // array di { id, handler }
  // popInProgress: true quando popHandler viene chiamato come conseguenza di popstate
  // (back hardware). Evita history.back() ricorsivi.
  const popInProgressRef = useRef(false);
  const initRef = useRef(false);

  useEffect(() => {
    if (typeof window === 'undefined') return;
    if (!initRef.current) {
      initRef.current = true;
      try {
        if (!window.history.state || !window.history.state.vbBase) {
          window.history.replaceState({ vbBase: true }, '');
        }
      } catch (e) {}
    }
    const onPop = () => {
      // Prendo il top dello stack interno. Se vuoto o handler obsoleto, lascio
      // che il browser gestisca normalmente (continua a tornare indietro).
      const top = stackRef.current[stackRef.current.length - 1];
      if (top) {
        popInProgressRef.current = true;
        try { top.handler(); } finally {
          Promise.resolve().then(() => { popInProgressRef.current = false; });
        }
      }
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const pushHandler = useCallback((handler) => {
    const id = Math.random().toString(36).slice(2);
    stackRef.current.push({ id, handler });
    try { window.history.pushState({ vbStackId: id }, ''); } catch (e) {}
    return id;
  }, []);

  const popHandler = useCallback((id) => {
    const idx = stackRef.current.findIndex(h => h.id === id);
    if (idx === -1) return;
    stackRef.current.splice(idx, 1);
    // Niente history.back() di cleanup: alcuni browser mobile bloccano lo scroll
    // dopo certe sequenze di pushState/back rapide. Lasciamo lo storico browser
    // leggermente piu' lungo dello stack interno: e' innocuo perche' onPop
    // controlla sempre lo stack interno per trovare l'handler da eseguire.
    // Conseguenza: dopo chiusure programmatiche multiple, l'utente potrebbe dover
    // premere back 1 volta in piu' per uscire dall'app. E' un compromesso accettabile.
  }, []);

  return (
    <BackStackContext.Provider value={{ pushHandler, popHandler }}>
      {children}
    </BackStackContext.Provider>
  );
}

// Hook: registra un handler quando 'enabled' è true. Quando enabled diventa false o il componente smonta,
// l'handler viene rimosso. Quando l'utente preme back e l'handler è in cima allo stack, viene chiamato.
function useAndroidBack(handler, enabled = true) {
  const ctx = useContext(BackStackContext);
  const handlerRef = useRef(handler);
  useEffect(() => { handlerRef.current = handler; }, [handler]);

  useEffect(() => {
    if (!enabled || !ctx) return;
    const id = ctx.pushHandler(() => handlerRef.current && handlerRef.current());
    return () => ctx.popHandler(id);
  }, [enabled, ctx]);
}

// ============= LOGICA BLOCCHI =============

const applyBlockLogic = (exercise, week) => {
  let { sets, reps, rir, rest, isCompound } = exercise;
  let blockName = 'ACCUMULO';
  if (week >= 4 && week <= 6) {
    blockName = 'INTENSIFICAZIONE';
    if (isCompound) { sets = Math.max(1, sets - 1); reps = '5-8'; rir = '1'; rest = '3:00-3:30'; }
    else { reps = '8-10'; rir = '1'; }
  } else if (week >= 7) {
    blockName = 'PEAK';
    if (isCompound) {
      sets = Math.max(1, sets - 1);
      reps = week === 8 ? '3-5 + AMRAP' : '4-6';
      rir = '0-1'; rest = '3:30-4:00';
    } else { sets = Math.max(1, sets - 1); reps = '6-8'; rir = '0'; }
  }
  return { sets, reps, rir, rest, blockName };
};

const parseRepRange = (repString) => {
  if (!repString) return { min: 0, max: 0 };
  const cleaned = repString.replace('AMRAP', '').replace('+', '').trim();
  if (cleaned.includes('-')) {
    const [min, max] = cleaned.split('-').map(r => parseInt(r));
    return { min: min || 0, max: isNaN(max) ? min : max };
  }
  return { min: parseInt(cleaned) || 0, max: parseInt(cleaned) || 0 };
};

const isLowerBody = (tags) => tags.some(t => ['QUAD', 'HAM', 'GLUTE', 'POLP'].includes(t));

const getSuggestedWeight = (exercise, currentWeek, dayId, allWorkouts) => {
  if (currentWeek <= 1) return null;
  const prevWeekData = allWorkouts[currentWeek - 1]?.[dayId]?.esercizi;
  if (!prevWeekData) return null;
  const exIdx = EXERCISES[dayId].findIndex(e => e.id === exercise.id);
  if (exIdx === -1) return null;
  const prevLog = prevWeekData[exIdx];
  if (!prevLog || !prevLog.kg) return null;
  const prevWeight = parseFloat(prevLog.kg);
  if (isNaN(prevWeight)) return null;
  const prevLogic = applyBlockLogic(exercise, currentWeek - 1);
  const prevTargets = parseRepRange(prevLogic.reps);
  const repsArr = (prevLog.reps || []).map(r => parseInt(r)).filter(r => !isNaN(r) && r > 0);
  const hitMaxReps = repsArr.length >= prevLogic.sets && repsArr.every(r => r >= prevTargets.max);
  const increment = isLowerBody(exercise.tags) ? 5 : 2.5;
  if (currentWeek === 4 && exercise.isCompound) {
    return (Math.round((prevWeight * 1.05) / 2.5) * 2.5).toFixed(1);
  }
  if (hitMaxReps) return (prevWeight + increment).toFixed(1);
  return prevWeight.toFixed(1);
};

const parseRestSeconds = (restStr) => {
  if (!restStr) return 90;
  const firstPart = restStr.split('-')[0].trim();
  if (firstPart.includes('s')) return parseInt(firstPart);
  const [m, s] = firstPart.split(':').map(n => parseInt(n));
  return (m || 0) * 60 + (s || 0);
};

// ============= STORAGE =============

const KEY_PREFIX = 'v8tracker_';
const storage = {
  get(key) { try { const v = localStorage.getItem(KEY_PREFIX + key); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(key, value) { try { localStorage.setItem(KEY_PREFIX + key, JSON.stringify(value)); return true; } catch (e) { return false; } },
  exportAll() {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(KEY_PREFIX)) data[k.replace(KEY_PREFIX, '')] = JSON.parse(localStorage.getItem(k));
    }
    return data;
  },
  importAll(data) { Object.entries(data).forEach(([k, v]) => { localStorage.setItem(KEY_PREFIX + k, JSON.stringify(v)); }); },
  clearAll() {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(KEY_PREFIX)) keys.push(k); }
    keys.forEach(k => localStorage.removeItem(k));
  },
};

  useEffect(() => {
    const sound = storage.get('soundEnabled');
    if (sound !== null) setSoundEnabled(sound);
    const saved = storage.get('activeTimer');
    if (saved && saved.startedAt) {
      const elapsed = Math.floor((Date.now() - saved.startedAt) / 1000);
      const newRemaining = saved.totalSeconds - elapsed;
      if (newRemaining > 0 && newRemaining < saved.totalSeconds + 60) {
        setActive(saved); setRemaining(newRemaining); setRunning(true);
      } else { storage.set('activeTimer', null); }
    }
  }, []);

  const startTimer = useCallback((seconds, exerciseName = '') => {
    const newTimer = { totalSeconds: seconds, startedAt: Date.now(), exerciseName };
    finishedRef.current = false;
    setActive(newTimer); setRemaining(seconds); setRunning(true);
    storage.set('activeTimer', newTimer);
  }, []);

  const stopTimer = useCallback(() => {
    setActive(null); setRemaining(0); setRunning(false);
    storage.set('activeTimer', null);
    if (intervalRef.current) { clearInterval(intervalRef.current); intervalRef.current = null; }
  }, []);

  const resetTimer = useCallback(() => {
    if (active) {
      const reset = { ...active, startedAt: Date.now() };
      finishedRef.current = false;
      setActive(reset); setRemaining(active.totalSeconds); setRunning(true);
      storage.set('activeTimer', reset);
    }
  }, [active]);

  const togglePause = useCallback(() => {
    if (running) {
      const newTimer = { ...active, totalSeconds: remaining, startedAt: null };
      setActive(newTimer); setRunning(false);
      storage.set('activeTimer', newTimer);
    } else {
      const newTimer = { ...active, startedAt: Date.now() };
      setActive(newTimer); setRunning(true);
      storage.set('activeTimer', newTimer);
    }
  }, [running, active, remaining]);

  const toggleSound = useCallback(() => {
    setSoundEnabled(prev => { const v = !prev; storage.set('soundEnabled', v); return v; });
  }, []);

  useEffect(() => {
    if (running && remaining > 0) {
      intervalRef.current = setInterval(() => {
        setRemaining(r => {
          if (r <= 1) {
            if (!finishedRef.current) {
              finishedRef.current = true;
              if (soundEnabled) {
                try {
                  const ctx = new (window.AudioContext || window.webkitAudioContext)();
                  const osc = ctx.createOscillator();
                  const gain = ctx.createGain();
                  osc.connect(gain); gain.connect(ctx.destination);
                  osc.frequency.value = 880;
                  gain.gain.setValueAtTime(0.3, ctx.currentTime);
                  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                  osc.start(); osc.stop(ctx.currentTime + 0.5);
                } catch (e) {}
              }
              if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            }
            setRunning(false);
            return 0;
          }
          return r - 1;
        });
      }, 1000);
    }
    return () => { if (intervalRef.current) clearInterval(intervalRef.current); };
  }, [running, soundEnabled]);

  return (
    <TimerContext.Provider value={{ active, remaining, running, soundEnabled, startTimer, stopTimer, resetTimer, togglePause, toggleSound }}>
      {children}
      {active && <FloatingTimer />}
    </TimerContext.Provider>
  );
}

function useTimer() { return useContext(TimerContext); }

const timerBtn = {

function FloatingTimer() {
  const { active, remaining, running, soundEnabled, stopTimer, resetTimer, togglePause, toggleSound } = useTimer();
  const [collapsed, setCollapsed] = useState(false);
  if (!active) return null;
  const min = Math.floor(remaining / 60);
  const sec = remaining % 60;
  const pct = active.totalSeconds > 0 ? ((active.totalSeconds - remaining) / active.totalSeconds) * 100 : 0;
  const isLowTime = remaining <= 10 && remaining > 0;
  const isFinished = remaining === 0;
  const bg = isFinished
    ? 'linear-gradient(135deg, rgba(102, 187, 106, 0.95), rgba(67, 160, 71, 0.85))'
    : isLowTime
      ? 'linear-gradient(135deg, rgba(239, 83, 80, 0.95), rgba(229, 57, 53, 0.85))'
      : 'linear-gradient(135deg, rgba(66, 165, 245, 0.95), rgba(30, 136, 229, 0.85))';

  if (collapsed) {
    return (
      <div onClick={() => setCollapsed(false)} style={{
        position: 'fixed', top: '12px', right: '12px', zIndex: 999,
        ...glassCard, background: bg, padding: '8px 12px', borderRadius: '14px',
        cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '6px',
        animation: 'slideDown 0.3s ease-out', boxShadow: '0 4px 16px rgba(0,0,0,0.4)',
      }}>
        <Timer size={14} color="#fff"/>
        <span style={{ fontSize: '14px', fontWeight: '700', color: '#fff', minWidth: '40px' }}>
          {String(min).padStart(2, '0')}:{String(sec).padStart(2, '0')}
        </span>
      </div>
    );
  }

  return (
    <div style={{
      position: 'fixed', bottom: '12px', left: '50%', transform: 'translateX(-50%)',
      zIndex: 999, width: '94%', maxWidth: '460px', ...glassCard, background: bg,
      padding: '12px 14px', animation: 'slideUp 0.3s ease-out', boxShadow: '0 8px 32px rgba(0,0,0,0.5)',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
        <Timer size={20} color="#fff"/>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: '10px', color: 'rgba(255,255,255,0.85)', textTransform: 'uppercase', letterSpacing: '0.5px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
            {isFinished ? 'Recupero finito!' : (active.exerciseName || 'Recupero')}
          </div>
          <div style={{ fontSize: '22px', fontWeight: '700', color: '#fff', lineHeight: 1 }}>
            {String(min).padStart(2, '0')}:{String(sec).padStart(2, '0')}
          </div>
        </div>
        <button onClick={toggleSound} style={timerBtn}>{soundEnabled ? <Volume2 size={14}/> : <VolumeX size={14}/>}</button>
        <button onClick={togglePause} style={timerBtn}>{running ? <Pause size={14}/> : <Play size={14}/>}</button>
        <button onClick={resetTimer} style={timerBtn}><RotateCcw size={14}/></button>
        <button onClick={() => setCollapsed(true)} style={{...timerBtn, fontSize: '13px', fontWeight: '700', padding: '6px 8px'}}>—</button>
        <button onClick={stopTimer} style={{...timerBtn, fontSize: '13px', fontWeight: '700', padding: '6px 8px'}}>✕</button>
      </div>
      <div style={{ height: '4px', background: 'rgba(255,255,255,0.2)', borderRadius: '2px', marginTop: '8px', overflow: 'hidden' }}>
        <div style={{ height: '100%', width: `${pct}%`, background: '#fff', transition: 'width 0.3s linear' }}/>
      </div>
    </div>
  );
}

function ExerciseImage({ exerciseId, tags, height = 160 }) {
  const [imgState, setImgState] = useState('loading');
  const [activeIdx, setActiveIdx] = useState(0);
  const urls = EXERCISE_IMAGES[exerciseId] || [];
  
  useEffect(() => {
    if (urls.length === 0) { setImgState('error'); return; }
    setImgState('loading'); setActiveIdx(0);
  }, [exerciseId]);

  const onError = () => {
    if (activeIdx < urls.length - 1) {
      setActiveIdx(activeIdx + 1);
      setImgState('loading');
    } else {
      setImgState('error');
    }
  };

  return (
    <div style={{
      width: '100%', height: `${height}px`,
      background: 'linear-gradient(135deg, rgba(20,20,35,0.6) 0%, rgba(40,30,60,0.4) 100%)',

      border: '1px solid rgba(255,255,255,0.08)',
    }}>
      {imgState === 'loading' && <div className="shimmer-bg" style={{ width: '100%', height: '100%' }}/>}
      {imgState !== 'error' && urls[activeIdx] && (
        <img
          key={`${exerciseId}-${activeIdx}`}
          src={urls[activeIdx]}
          alt=""
          onLoad={() => setImgState('loaded')}
          onError={onError}
          style={{
            width: '100%', height: '100%', objectFit: 'contain', background: '#fff',
            display: imgState === 'loaded' ? 'block' : 'none',
          }}
        />
      )}
      {imgState === 'error' && <FallbackSVG tags={tags} height={height}/>}
    </div>
  );
}

  const [selectedDay, setSelectedDay] = useState(null);

  //  - se siamo nel detail: torna alla lista del giorno
  //  - altrimenti se siamo in 'day': torna a 'select'
  // Quando siamo in 'select' il back globale (App) ci porta alla home.
  const handleInternalBack = useCallback(() => {
    if (detailExercise) { setDetailExercise(null); return; }
    if (view === 'day') { setView('select'); return; }
  }, [detailExercise, view]);
  useAndroidBack(handleInternalBack, !!detailExercise || view === 'day');

  useEffect(() => { setData(storage.get('workouts') || {}); }, []);

  const getBlock = (week) => BLOCKS.find(b => b.weeks.includes(week));

  const updateExercise = (week, day, exIdx, field, value, setIdx) => {
    const newData = JSON.parse(JSON.stringify(data));
    if (!newData[week]) newData[week] = {};
    if (!newData[week][day]) newData[week][day] = { esercizi: {}, completato: false };
    if (!newData[week][day].esercizi[exIdx]) newData[week][day].esercizi[exIdx] = { kg: '', reps: ['', '', '', ''], rir: '', sets_done: [] };
    if (field === 'kg' || field === 'rir') newData[week][day].esercizi[exIdx][field] = value;
    else if (field === 'reps') {
      if (!newData[week][day].esercizi[exIdx].reps) newData[week][day].esercizi[exIdx].reps = [];
      newData[week][day].esercizi[exIdx].reps[setIdx] = value;
    }
    else if (field === 'sets_done') {
      if (!newData[week][day].esercizi[exIdx].sets_done) newData[week][day].esercizi[exIdx].sets_done = [];
      newData[week][day].esercizi[exIdx].sets_done[setIdx] = value;
    }
    setData(newData);
    storage.set('workouts', newData);
  };

  const toggleComplete = (week, day) => {
    const newData = JSON.parse(JSON.stringify(data));
    if (!newData[week]) newData[week] = {};
    if (!newData[week][day]) newData[week][day] = { esercizi: {}, completato: false };
    newData[week][day].completato = !newData[week][day].completato;
    setData(newData);
    storage.set('workouts', newData);
  };

  const isCompleted = (week, day) => data[week]?.[day]?.completato || false;

  if (detailExercise) {
    return <ExerciseDetailScreen exercise={detailExercise} week={selectedWeek} dayId={selectedDay} goBack={() => setDetailExercise(null)}/>;
  }

  if (view === 'select') {
    const block = getBlock(selectedWeek);
    return (
      <div style={{ minHeight: '100vh', background: bgGradient, paddingBottom: '120px' }}>
        <Header title="Workout" subtitle="Seleziona settimana e giorno" onBack={goBack} />
        <div style={{ padding: '0 12px' }}>
          <div style={{ ...glassCard, padding: '16px', marginBottom: '14px' }}>
            <div style={{ fontSize: '10px', textTransform: 'uppercase', color: '#a8a8b8', marginBottom: '10px', letterSpacing: '0.6px' }}>Settimana</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '6px' }}>
              {[1,2,3,4,5,6,7,8].map(w => {
                const b = getBlock(w);
                const active = selectedWeek === w;
                return (
                  <button key={w} onClick={() => setSelectedWeek(w)} style={{
                    padding: '12px 0',
                    background: active ? `linear-gradient(135deg, ${b.color} 0%, ${b.color}cc 100%)` : 'rgba(255,255,255,0.05)',
                    color: active ? 'white' : '#a8a8b8',
                    border: active ? `1px solid ${b.color}` : '1px solid rgba(255,255,255,0.08)',
                    borderRadius: '12px', fontWeight: '700', fontSize: '15px', cursor: 'pointer',
                    boxShadow: active ? `0 4px 12px ${b.color}66` : 'none',
                  }}>S{w}</button>
                );
              })}
            </div>
            <div style={{ marginTop: '12px', padding: '10px 12px', background: `${block.color}1a`, borderLeft: `3px solid ${block.color}`, borderRadius: '8px' }}>
              <div style={{ fontSize: '11px', fontWeight: '700', color: block.color }}>{block.label}</div>
              <div style={{ fontSize: '10px', color: '#a8a8b8', marginTop: '3px' }}>Reps: {block.reps} · RIR: {block.rir}</div>
            </div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
            {DAYS.map(d => {
              const completed = isCompleted(selectedWeek, d.id);
              return (
                <button key={d.id} onClick={() => { setSelectedDay(d.id); setView('day'); }} style={{ ...glassCard, display: 'flex', alignItems: 'center', gap: '14px', padding: '16px', textAlign: 'left', cursor: 'pointer', borderLeft: `3px solid ${d.color}` }}>
                  <div style={{ background: `${d.color}22`, border: `1px solid ${d.color}55`, padding: '8px 12px', borderRadius: '10px', minWidth: '52px', textAlign: 'center' }}>
                    <div style={{ fontSize: '9px', color: d.color, opacity: 0.7, fontWeight: '600' }}>{d.dayName}</div>
                    <div style={{ fontSize: '13px', color: d.color, fontWeight: '700' }}>{d.label}</div>
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: '13px', color: '#fff', fontWeight: '600' }}>{d.subtitle}</div>
                    <div style={{ fontSize: '11px', color: '#a8a8b8', marginTop: '2px' }}>{d.dur}</div>
                  </div>
                  {completed && (
                    <div style={{ background: 'rgba(102, 187, 106, 0.2)', border: '1px solid rgba(102, 187, 106, 0.5)', borderRadius: '20px', padding: '4px 8px', display: 'flex', alignItems: 'center', gap: '4px' }}>
                      <Check size={12} color="#66bb6a" />
                      <span style={{ fontSize: '10px', color: '#66bb6a', fontWeight: '600' }}>OK</span>
                    </div>
                  )}
                  <ChevronRight size={18} color="#666"/>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  const day = DAYS.find(d => d.id === selectedDay);
  const exercises = EXERCISES[selectedDay];
  const block = getBlock(selectedWeek);
  const completed = isCompleted(selectedWeek, selectedDay);
  const isRotA = selectedWeek % 2 === 1;

  return (
    <div style={{ minHeight: '100vh', background: bgGradient, paddingBottom: '140px' }}>
      <Header title={`S${selectedWeek} · ${day.dayName} · ${day.label}`} subtitle={`${block.label} · ${day.subtitle}`} onBack={() => setView('select')}/>
      <div style={{ padding: '0 12px' }}>
        <div style={{
          background: isRotA ? 'rgba(255, 167, 38, 0.1)' : 'rgba(38, 198, 218, 0.1)',
          border: `1px solid ${isRotA ? 'rgba(255, 167, 38, 0.3)' : 'rgba(38, 198, 218, 0.3)'}`,
          borderRadius: '10px', padding: '8px 12px', marginBottom: '12px',
          fontSize: '11px', color: isRotA ? '#ffb74d' : '#26c6da', textAlign: 'center',
        }}>
          Settimana {selectedWeek} → Rotazione <strong>{isRotA ? 'A (sett 1-3-5-7)' : 'B (sett 2-4-6-8)'}</strong>
        </div>
        {exercises.map((ex, idx) => {
          const exData = data[selectedWeek]?.[selectedDay]?.esercizi?.[idx] || { kg: '', reps: ['', '', '', ''], rir: '' };
          const logic = applyBlockLogic(ex, selectedWeek);
          const suggested = getSuggestedWeight(ex, selectedWeek, selectedDay, data);
          const goalReached = (() => {
            if (!suggested || !exData.kg) return false;
            const targets = parseRepRange(logic.reps);
            const repsArr = (exData.reps || []).map(r => parseInt(r)).filter(r => !isNaN(r) && r > 0);
            return repsArr.length >= logic.sets && repsArr.every(r => r >= targets.max);
          })();
          return (
            <div key={idx} style={{ ...glassCard, padding: '14px', marginBottom: '12px' }}>
              <button onClick={() => setDetailExercise(ex)} style={{ width: '100%', textAlign: 'left', padding: 0, background: 'none', border: 'none', cursor: 'pointer', marginBottom: '10px' }}>
                <ExerciseImage exerciseId={ex.id} tags={ex.tags} height={140}/>
              </button>
              <div style={{ marginBottom: '6px' }}>
                {ex.tags.map(t => <Tag key={t} name={t}/>)}
                {ex.badges.map(b => <Badge key={b} name={b}/>)}
              </div>
              <button onClick={() => setDetailExercise(ex)} style={{ width: '100%', textAlign: 'left', padding: '6px 0', background: 'none', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '8px', marginBottom: '4px' }}>
                <div style={{ fontSize: '14px', fontWeight: '700', color: '#fff', lineHeight: 1.3, flex: 1 }}>{idx + 1}. {ex.name}</div>
                <Info size={14} color="#64b5f6" style={{ flexShrink: 0 }}/>
              </button>
              {ex.shortNote && (
                <div style={{ fontSize: '10px', color: '#a8a8b8', fontStyle: 'italic', marginBottom: '10px', lineHeight: 1.5, padding: '6px 10px', background: 'rgba(255,255,255,0.03)', borderRadius: '6px', borderLeft: `2px solid ${day.color}66` }}>
                  {ex.shortNote}
                </div>
              )}
              <div style={{ display: 'flex', flexWrap: 'wrap', marginBottom: '12px' }}>
                <MetaPill label="Set" value={logic.sets}/>
                <MetaPill label="Rep" value={logic.reps}/>
                <MetaPill label="RIR" value={logic.rir}/>
                <MetaPill label="Rest" value={logic.rest} IconComp={Timer} color="#42a5f5"/>
              </div>
              {suggested && !exData.kg && (
                <div style={{ background: 'rgba(255, 167, 38, 0.12)', border: '1px solid rgba(255, 167, 38, 0.4)', borderRadius: '10px', padding: '8px 12px', marginBottom: '10px', display: 'flex', alignItems: 'center', gap: '8px', animation: 'pulseGlow 2s infinite' }}>
                  <Lightbulb size={16} color="#ffa726"/>
                  <div style={{ flex: 1, fontSize: '11px', color: '#ffd180' }}>
                    Suggerito: <strong style={{ color: '#ffa726', fontSize: '13px' }}>{suggested} kg</strong>
                    {selectedWeek === 4 && ex.isCompound && <span style={{ fontSize: '10px', marginLeft: '6px', color: '#ffb74d' }}>(+5% A→B)</span>}
                  </div>
                  <button onClick={() => updateExercise(selectedWeek, selectedDay, idx, 'kg', suggested)} style={{ background: 'rgba(255, 167, 38, 0.25)', border: '1px solid rgba(255, 167, 38, 0.5)', color: '#ffa726', fontSize: '10px', fontWeight: '700', padding: '4px 10px', borderRadius: '8px', cursor: 'pointer' }}>Usa</button>
                </div>
              )}
              {goalReached && (
                <div style={{ background: 'rgba(102, 187, 106, 0.15)', border: '1px solid rgba(102, 187, 106, 0.4)', borderRadius: '10px', padding: '8px 12px', marginBottom: '10px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <Check size={16} color="#66bb6a"/>
                  <div style={{ fontSize: '11px', color: '#a5d6a7' }}>
                    <strong style={{ color: '#66bb6a' }}>Obiettivo raggiunto!</strong> Sett prossima: +{isLowerBody(ex.tags) ? '5' : '2,5'} kg
                  </div>
                </div>
              )}
              <div style={{ display: 'flex', gap: '8px', marginBottom: '10px' }}>
                <div style={{ flex: '2' }}>
                  <div style={{ fontSize: '9px', textTransform: 'uppercase', color: '#888', marginBottom: '4px', letterSpacing: '0.5px', textAlign: 'center' }}>Kg working</div>
                  <input type="number" inputMode="decimal" step="0.5" placeholder={suggested || '—'} value={exData.kg} onChange={(e) => updateExercise(selectedWeek, selectedDay, idx, 'kg', e.target.value)} style={{ ...inputDark, width: '100%', padding: '10px', fontSize: '16px', fontWeight: '700', color: day.color, border: `1px solid ${day.color}55`, boxSizing: 'border-box' }}/>
                </div>
                <div style={{ flex: '1' }}>
                  <div style={{ fontSize: '9px', textTransform: 'uppercase', color: '#888', marginBottom: '4px', letterSpacing: '0.5px', textAlign: 'center' }}>RIR</div>
                  <input type="number" inputMode="numeric" placeholder="—" value={exData.rir} onChange={(e) => updateExercise(selectedWeek, selectedDay, idx, 'rir', e.target.value)} style={{ ...inputDark, width: '100%', padding: '10px', fontSize: '16px', fontWeight: '700', boxSizing: 'border-box' }}/>
                </div>
              </div>
              <div style={{ marginBottom: '10px' }}>
                <div style={{ fontSize: '9px', textTransform: 'uppercase', color: '#888', marginBottom: '6px', letterSpacing: '0.5px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span>Serie</span>
                  <span style={{ color: '#666', fontWeight: '600', textTransform: 'none', letterSpacing: 0 }}>tap ✓ per partire timer {logic.rest}</span>
                </div>
                {Array.from({ length: logic.sets }).map((_, setIdx) => {
                  const repValue = exData.reps?.[setIdx] || '';
                  const isDone = !!exData.sets_done?.[setIdx];
                  const targets = parseRepRange(logic.reps);
                  const repNum = parseInt(repValue);
                  let borderColor = 'rgba(255,255,255,0.1)';
                  if (!isNaN(repNum) && repNum > 0) {
                    if (repNum >= targets.max) borderColor = 'rgba(102, 187, 106, 0.5)';
                    else if (repNum >= targets.min) borderColor = 'rgba(66, 165, 245, 0.5)';
                    else borderColor = 'rgba(239, 83, 80, 0.5)';
                  }
                  return (
                    <div key={setIdx} style={{
                      display: 'grid',
                      gridTemplateColumns: '32px 1fr 44px',
                      alignItems: 'center',
                      gap: '8px',
                      padding: '6px 8px',
                      marginBottom: '6px',
                      borderRadius: '10px',
                      background: isDone ? 'rgba(102, 187, 106, 0.10)' : 'rgba(255,255,255,0.02)',
                      border: isDone ? '1px solid rgba(102, 187, 106, 0.30)' : '1px solid rgba(255,255,255,0.05)',
                      transition: 'all 0.2s',
                    }}>
                      <div style={{ fontSize: '12px', color: isDone ? '#66bb6a' : day.color, fontWeight: '700', textAlign: 'center' }}>{setIdx + 1}</div>
                      <input
                        type="number"
                        inputMode="numeric"
                        placeholder={String(targets.max)}
                        value={repValue}
                        onChange={(e) => updateExercise(selectedWeek, selectedDay, idx, 'reps', e.target.value, setIdx)}
                        style={{ ...inputDark, width: '100%', padding: '8px 10px', fontSize: '14px', fontWeight: '700', border: `1px solid ${borderColor}`, boxSizing: 'border-box', textAlign: 'center' }}
                      />
                      <button
                        onClick={() => {
                          const willBeDone = !isDone;
                          // Se non ho inserito reps e sto confermando, uso il massimo del range
                          if (willBeDone && (!repValue || repValue === '')) {
                            updateExercise(selectedWeek, selectedDay, idx, 'reps', String(targets.max), setIdx);
                          }
                          updateExercise(selectedWeek, selectedDay, idx, 'sets_done', willBeDone, setIdx);
                          if (willBeDone) {
                            startTimer(parseRestSeconds(logic.rest), `${ex.name} S${setIdx+1}`);
                            try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}
                          }
                        }}
                        style={{
                          width: '40px', height: '38px', borderRadius: '10px',
                          background: isDone ? 'linear-gradient(135deg, #66bb6a, #43a047)' : 'rgba(255,255,255,0.06)',
                          border: isDone ? '1px solid rgba(102, 187, 106, 0.6)' : '1px solid rgba(255,255,255,0.12)',
                          color: isDone ? '#fff' : '#888',
                          cursor: 'pointer',
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          boxShadow: isDone ? '0 0 12px rgba(102, 187, 106, 0.4)' : 'none',
                          transition: 'all 0.2s',
                        }}
                        aria-label={isDone ? 'Annulla serie' : 'Conferma serie e avvia timer'}
                      >
                        <Check size={18}/>
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
        <button onClick={() => toggleComplete(selectedWeek, selectedDay)} style={{ width: '100%', padding: '16px', marginTop: '8px', background: completed ? 'linear-gradient(135deg, #66bb6a 0%, #43a047 100%)' : 'linear-gradient(135deg, #42a5f5 0%, #1e88e5 100%)', color: 'white', border: 'none', borderRadius: '14px', fontSize: '14px', fontWeight: '700', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', boxShadow: '0 4px 12px rgba(0,0,0,0.3)' }}>
          {completed ? <><Check size={18} /> Sessione completata</> : <><Save size={18} /> Segna come completato</>}
        </button>
      </div>
    </div>
  );
}
// ============= PESO =============

function PesoScreen({ goBack }) {
  const [data, setData] = useState({});
  const [pesoIniziale, setPesoIniziale] = useState(100);
  const [misure, setMisure] = useState({});
  const [foto, setFoto] = useState({});
  const [tab, setTab] = useState('peso');

  useEffect(() => {
    setData(storage.get('peso') || {});
    const init = storage.get('pesoIniziale');
    if (init) setPesoIniziale(init);
    setMisure(storage.get('misure') || {});
    setFoto(storage.get('foto') || {});
  }, []);

  const updatePeso = (week, day, value) => {
    const newData = JSON.parse(JSON.stringify(data));
    if (!newData[week]) newData[week] = { lun: '', mer: '', ven: '', dom: '', media: 0, note: '' };
    newData[week][day] = value;
    const days = ['lun', 'mer', 'ven', 'dom'];
    const valori = days.map(d => parseFloat(newData[week][d])).filter(v => !isNaN(v) && v > 0);
    newData[week].media = valori.length > 0 ? valori.reduce((a,b)=>a+b,0) / valori.length : 0;
    setData(newData); storage.set('peso', newData);
  };
  const updateNote = (week, value) => {
    const newData = JSON.parse(JSON.stringify(data));
    if (!newData[week]) newData[week] = { lun: '', mer: '', ven: '', dom: '', media: 0, note: '' };
    newData[week].note = value;
    setData(newData); storage.set('peso', newData);
  };
  const updatePesoIniziale = (value) => { const v = parseFloat(value) || 100; setPesoIniziale(v); storage.set('pesoIniziale', v); };
  const updateMisura = (block, point, value) => {
    const newM = { ...misure };
    if (!newM[block]) newM[block] = {};
    newM[block][point] = value;
    setMisure(newM); storage.set('misure', newM);
  };
  const toggleFoto = (key) => { const newF = { ...foto, [key]: !foto[key] }; setFoto(newF); storage.set('foto', newF); };
  const getDelta = (week) => {
    if (!data[week]?.media) return null;
    if (week === 1) return data[week].media - pesoIniziale;
    if (data[week-1]?.media) return data[week].media - data[week-1].media;
    return null;
  };
  const getStatusColor = (delta) => {
    if (delta === null) return '#888';
    if (delta <= -0.5 && delta >= -0.8) return '#66bb6a';
    if (delta < -0.8) return '#ffa726';
    if (delta > 0.3) return '#ef5350';
    return '#a8a8b8';
  };
  const punti = ['Vita ombelicale', 'Petto', 'Coscia (max)', 'Polpaccio', 'Braccio (flesso)', 'Avambraccio'];

  return (
    <div style={{ minHeight: '100vh', background: bgGradient, paddingBottom: '120px' }}>
      <Header title="Peso & Misure" onBack={goBack}/>
      <div style={{ ...glassCard, margin: '0 12px 14px 12px', padding: '6px', display: 'flex' }}>
        {[{ id: 'peso', label: 'Peso 4×/sett' }, { id: 'misure', label: 'Misure' }, { id: 'foto', label: 'Foto' }].map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ flex: 1, padding: '10px 4px', border: 'none', background: tab === t.id ? 'linear-gradient(135deg, #42a5f5 0%, #1e88e5 100%)' : 'transparent', color: tab === t.id ? 'white' : '#a8a8b8', fontSize: '12px', fontWeight: tab === t.id ? '700' : '500', cursor: 'pointer', borderRadius: '10px' }}>{t.label}</button>
        ))}
      </div>
      <div style={{ padding: '0 12px' }}>
        {tab === 'peso' && (<>
          <div style={{ ...glassCard, padding: '16px', marginBottom: '14px' }}>
            <div style={{ fontSize: '11px', color: '#a8a8b8', textTransform: 'uppercase', letterSpacing: '0.6px', marginBottom: '8px' }}>Peso iniziale</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              <input type="number" inputMode="decimal" step="0.1" value={pesoIniziale} onChange={(e) => updatePesoIniziale(e.target.value)} style={{ ...inputDark, width: '110px', padding: '10px', fontSize: '20px', fontWeight: '700', color: '#42a5f5', border: '1px solid rgba(66, 165, 245, 0.4)' }}/>
              <span style={{ fontSize: '14px', color: '#a8a8b8' }}>kg</span>
            </div>
          </div>
          {[1,2,3,4,5,6,7,8].map(w => {
            const wd = data[w] || { lun: '', mer: '', ven: '', dom: '', media: 0, note: '' };
            const delta = getDelta(w);
            return (
              <div key={w} style={{ ...glassCard, padding: '14px', marginBottom: '10px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                  <div style={{ fontSize: '13px', fontWeight: '700', color: '#42a5f5' }}>SETTIMANA {w}</div>
                  {wd.media > 0 && (
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                      {delta !== null && <span style={{ color: getStatusColor(delta), fontWeight: '700', fontSize: '12px' }}>{delta > 0 ? '+' : ''}{delta.toFixed(1)}</span>}
                      <span style={{ fontWeight: '700', color: '#fff', fontSize: '14px' }}>{wd.media.toFixed(1)} kg</span>
                    </div>
                  )}
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '6px', marginBottom: '8px' }}>
                  {['lun','mer','ven','dom'].map(d => (
                    <div key={d}>
                      <div style={{ fontSize: '9px', textTransform: 'uppercase', color: '#888', textAlign: 'center', marginBottom: '3px' }}>{d}</div>
                      <input type="number" inputMode="decimal" step="0.1" value={wd[d]} onChange={(e) => updatePeso(w, d, e.target.value)} placeholder="—" style={{ ...inputDark, width: '100%', padding: '8px 2px', fontSize: '13px', boxSizing: 'border-box', fontWeight: '600' }}/>
                    </div>
                  ))}
                </div>
                <input type="text" placeholder="Note..." value={wd.note} onChange={(e) => updateNote(w, e.target.value)} style={{ ...inputDark, width: '100%', padding: '8px', fontSize: '11px', textAlign: 'left', boxSizing: 'border-box' }}/>
              </div>
            );
          })}
        </>)}
        {tab === 'misure' && (<>
          <div style={{ fontSize: '11px', color: '#a8a8b8', marginBottom: '14px', padding: '12px', background: 'rgba(255, 167, 38, 0.1)', borderLeft: '3px solid #ffa726', borderRadius: '8px' }}>Misura ogni 4 settimane (fine blocco). Centimetri.</div>
          {['INIZIO', 'FINE BL.A (S3)', 'FINE BL.B (S6)', 'FINE BL.C (S8)'].map(b => (
            <div key={b} style={{ ...glassCard, padding: '14px', marginBottom: '10px' }}>
              <div style={{ fontSize: '12px', fontWeight: '700', color: '#42a5f5', marginBottom: '12px' }}>{b}</div>
              {punti.map(p => (
                <div key={p} style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '8px' }}>
                  <div style={{ flex: 1, fontSize: '12px', color: '#e8e8f0' }}>{p}</div>
                  <input type="number" inputMode="decimal" step="0.1" value={misure[b]?.[p] || ''} onChange={(e) => updateMisura(b, p, e.target.value)} placeholder="—" style={{ ...inputDark, width: '80px', padding: '8px', fontSize: '12px', fontWeight: '600' }}/>
                  <span style={{ fontSize: '10px', color: '#888' }}>cm</span>
                </div>
              ))}
            </div>
          ))}
        </>)}
        {tab === 'foto' && (<>
          <div style={{ fontSize: '11px', color: '#a8a8b8', marginBottom: '14px', padding: '12px', background: 'rgba(255, 167, 38, 0.1)', borderLeft: '3px solid #ffa726', borderRadius: '8px', lineHeight: 1.6 }}>
            <strong style={{ color: '#ffa726' }}>Come fare le foto:</strong> 3 angoli (frontale/laterale/dorso). Stessa luce, stessa ora, stesso pasto giorno prima.
          </div>
          {[{ id: 'inizio', label: 'Inizio (S1)' },{ id: 'fineA', label: 'Fine Blocco A (S4)' },{ id: 'fineB', label: 'Fine Blocco B (S7)' },{ id: 'fineC', label: 'Fine Blocco C (S9)' }].map(f => (
            <button key={f.id} onClick={() => toggleFoto(f.id)} style={{ ...glassCard, width: '100%', padding: '16px', marginBottom: '10px', background: foto[f.id] ? 'linear-gradient(135deg, rgba(102, 187, 106, 0.25) 0%, rgba(102, 187, 106, 0.1) 100%)' : glassCard.background, border: foto[f.id] ? '1px solid rgba(102, 187, 106, 0.5)' : glassCard.border, color: '#fff', fontSize: '13px', fontWeight: '600', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '14px' }}>
              {foto[f.id] ? <Check size={22} color="#66bb6a"/> : <Camera size={22} color="#888"/>}
              <span style={{ flex: 1, textAlign: 'left' }}>{f.label}</span>
              {foto[f.id] && <span style={{ fontSize: '11px', color: '#66bb6a', fontWeight: '700' }}>FATTE ✓</span>}
            </button>
          ))}
        </>)}
      </div>
    </div>
  );
}

// ============= DASHBOARD =============

function DashboardScreen({ goBack }) {
  const [workouts, setWorkouts] = useState({});
  const [pesoData, setPesoData] = useState({});
  const [pesoIniziale, setPesoIniziale] = useState(100);

  useEffect(() => {
    setWorkouts(storage.get('workouts') || {});
    setPesoData(storage.get('peso') || {});
    setPesoIniziale(storage.get('pesoIniziale') || 100);
  }, []);

  const get1RM = (compound) => {
    const result = {};
    [1, 4, 7, 8].forEach(week => {
      const ex = workouts[week]?.[compound.day]?.esercizi?.[compound.idx];
      if (ex && ex.kg && ex.reps?.[0]) {
        const kg = parseFloat(ex.kg);
        const reps = parseFloat(ex.reps[0]);
        if (!isNaN(kg) && !isNaN(reps) && kg > 0 && reps > 0) result[week] = kg * (1 + reps / 30);
      }
    });
    return result;
  };

  const ultimaSett = Object.entries(pesoData).filter(([_, v]) => v.media > 0).sort((a,b) => parseInt(a[0]) - parseInt(b[0])).slice(-1)[0];
  const pesoAttuale = ultimaSett ? ultimaSett[1].media : pesoIniziale;
  const perditaTot = pesoAttuale - pesoIniziale;
  let sessioniTot = 0;
  Object.values(workouts).forEach(w => Object.values(w).forEach(d => { if (d?.completato) sessioniTot++; }));

  return (
    <div style={{ minHeight: '100vh', background: bgGradient, paddingBottom: '120px' }}>
      <Header title="Dashboard" subtitle="Progressi del ciclo" onBack={goBack}/>
      <div style={{ padding: '0 12px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '14px' }}>
          {[
            { label: 'Iniziale', value: pesoIniziale.toFixed(1), unit: 'kg', color: '#ab47bc' },
            { label: 'Attuale', value: pesoAttuale.toFixed(1), unit: 'kg', color: '#42a5f5' },
            { label: 'Δ Totale', value: (perditaTot > 0 ? '+' : '') + perditaTot.toFixed(1), unit: 'kg', color: perditaTot < 0 ? '#66bb6a' : '#ef5350' },
            { label: 'Sessioni', value: sessioniTot, unit: '/ 40', color: '#ffa726' },
          ].map((stat, i) => (
            <div key={i} style={{ ...glassCard, padding: '14px', textAlign: 'center' }}>
              <div style={{ fontSize: '9px', color: '#a8a8b8', textTransform: 'uppercase', letterSpacing: '0.6px' }}>{stat.label}</div>
              <div style={{ fontSize: '24px', fontWeight: '700', color: stat.color, marginTop: '4px' }}>{stat.value}</div>
              <div style={{ fontSize: '10px', color: '#888' }}>{stat.unit}</div>
            </div>
          ))}
        </div>
        <div style={{ ...glassCard, padding: '16px', marginBottom: '14px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px' }}>
            <Dumbbell size={16} color="#ab47bc"/>
            <div style={{ fontSize: '13px', fontWeight: '700', color: '#fff' }}>1RM Stimato (Epley)</div>
          </div>
          <div style={{ fontSize: '10px', color: '#a8a8b8', marginBottom: '12px' }}>1RM = peso × (1 + reps/30). Affidabile 3-10 rep.</div>
          {COMPOUNDS.slice(0, 5).map((c, i) => {
            const r = get1RM(c);
            const ini = r[1], finA = r[4], finC = r[8];
            return (
              <div key={i} style={{ borderBottom: i < 4 ? '1px solid rgba(255,255,255,0.06)' : 'none', padding: '10px 0' }}>
                <div style={{ fontSize: '12px', fontWeight: '600', color: '#fff', marginBottom: '6px' }}>{c.name}</div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '6px' }}>
                  {[{ label: 'S1', val: ini },{ label: 'S4', val: finA },{ label: 'S8', val: finC }].map(b => (
                    <div key={b.label} style={{ textAlign: 'center', background: 'rgba(171, 71, 188, 0.1)', border: '1px solid rgba(171, 71, 188, 0.2)', padding: '6px 4px', borderRadius: '8px' }}>
                      <div style={{ fontSize: '8px', color: '#a8a8b8', textTransform: 'uppercase' }}>{b.label}</div>
                      <div style={{ fontSize: '13px', fontWeight: '700', color: '#ab47bc' }}>{b.val ? b.val.toFixed(1) : '—'}</div>
                    </div>
                  ))}
                  {ini && finC ? (
                    <div style={{ textAlign: 'center', background: finC > ini ? 'rgba(102, 187, 106, 0.15)' : 'rgba(239, 83, 80, 0.15)', border: `1px solid ${finC > ini ? 'rgba(102, 187, 106, 0.3)' : 'rgba(239, 83, 80, 0.3)'}`, padding: '6px 4px', borderRadius: '8px' }}>
                      <div style={{ fontSize: '8px', color: '#a8a8b8', textTransform: 'uppercase' }}>Δ</div>
                      <div style={{ fontSize: '13px', fontWeight: '700', color: finC > ini ? '#66bb6a' : '#ef5350' }}>{finC > ini ? '+' : ''}{(finC - ini).toFixed(1)}</div>
                    </div>
                  ) : (
                    <div style={{ textAlign: 'center', padding: '6px 4px', borderRadius: '8px', background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.05)' }}>
                      <div style={{ fontSize: '8px', color: '#888', textTransform: 'uppercase' }}>Δ</div>
                      <div style={{ fontSize: '13px', color: '#666' }}>—</div>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ ...glassCard, padding: '16px', marginBottom: '14px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '12px' }}>
            <Scale size={16} color="#42a5f5"/>
            <div style={{ fontSize: '13px', fontWeight: '700', color: '#fff' }}>Andamento peso settimanale</div>
          </div>
          {[1,2,3,4,5,6,7,8].map(w => {
            const wd = pesoData[w];
            if (!wd?.media) return (
              <div key={w} style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '8px 0', borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
                <div style={{ fontSize: '11px', fontWeight: '700', width: '30px', color: '#666' }}>S{w}</div>
                <div style={{ flex: 1, fontSize: '11px', color: '#444' }}>—</div>
              </div>
            );
            const prev = pesoData[w-1]?.media || pesoIniziale;
            const delta = wd.media - prev;
            let statusColor = '#a8a8b8', statusText = '○';
            if (delta <= -0.5 && delta >= -0.8) { statusColor = '#66bb6a'; statusText = '✓'; }
            else if (delta < -0.8) { statusColor = '#ffa726'; statusText = '⚠'; }
            else if (delta > 0.3) { statusColor = '#ef5350'; statusText = '⚠'; }
            const I = delta < -0.1 ? TrendingDown : delta > 0.1 ? TrendingUp : Minus;
            const iconColor = delta < -0.1 ? '#66bb6a' : delta > 0.1 ? '#ef5350' : '#888';
            return (
              <div key={w} style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '8px 0', borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
                <div style={{ fontSize: '11px', fontWeight: '700', width: '30px', color: '#a8a8b8' }}>S{w}</div>
                <I size={14} color={iconColor}/>
                <div style={{ flex: 1, fontSize: '13px', fontWeight: '700', color: '#fff' }}>{wd.media.toFixed(1)} kg</div>
                <div style={{ fontSize: '11px', color: iconColor, fontWeight: '700', width: '50px', textAlign: 'right' }}>{delta > 0 ? '+' : ''}{delta.toFixed(1)}</div>
                <div style={{ fontSize: '14px', color: statusColor, width: '20px', textAlign: 'center' }}>{statusText}</div>
              </div>
            );
          })}
          <div style={{ fontSize: '9px', color: '#888', marginTop: '10px', lineHeight: 1.6 }}>
            ✓ optimal (-0.5/-0.8) · ⚠ troppo veloce o no progress · ○ lento
          </div>
        </div>
      </div>
    </div>
  );
}

function RecoveryScreen({ goBack }) {
  const [data, setData] = useState({});

    const newData = JSON.parse(JSON.stringify(data));
    if (!newData[week]) newData[week] = { sonno: '', energia: '', recupero: '', stress: '', note: '' };
    newData[week][field] = value;
    setData(newData);

function SettingsScreen({ goBack }) {
  const [msg, setMsg] = useState(null);
  const fileInputRef = useRef(null);
  const exportData = () => {
    const data = storage.exportAll();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const date = new Date().toISOString().split('T')[0];
    a.download = `v8tracker-backup-${date}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setMsg({ type: 'success', text: 'Backup scaricato!' });
    setTimeout(() => setMsg(null), 3000);
  };
  const importData = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (confirm('Importare i dati? Sovrascriverà i dati attuali.')) {
          storage.importAll(data);
          setMsg({ type: 'success', text: 'Dati importati! Ricarica la pagina.' });
          setTimeout(() => window.location.reload(), 1500);
        }
      } catch (err) {
        setMsg({ type: 'error', text: 'File non valido.' });
        setTimeout(() => setMsg(null), 3000);
      }
    };
    reader.readAsText(file);
  };
  const clearAll = () => {
    if (confirm('CANCELLARE TUTTI I DATI?')) {
      if (confirm('Sei davvero sicuro?')) {
        storage.clearAll();
        setMsg({ type: 'success', text: 'Dati cancellati.' });
        setTimeout(() => window.location.reload(), 1000);
      }
    }
  };
  return (
    <div style={{ minHeight: '100vh', background: bgGradient, paddingBottom: '120px' }}>
      <Header title="Impostazioni & Backup" onBack={goBack}/>
      <div style={{ padding: '0 12px' }}>
        {msg && (
          <div style={{ padding: '10px 14px', marginBottom: '14px', borderRadius: '10px', background: msg.type === 'success' ? 'rgba(102, 187, 106, 0.2)' : 'rgba(239, 83, 80, 0.2)', border: `1px solid ${msg.type === 'success' ? '#66bb6a' : '#ef5350'}`, color: msg.type === 'success' ? '#66bb6a' : '#ef5350', fontSize: '12px', fontWeight: '600' }}>{msg.text}</div>
        )}
        <div style={{ ...glassCard, padding: '16px', marginBottom: '14px' }}>
          <div style={{ fontSize: '13px', fontWeight: '700', color: '#fff', marginBottom: '8px' }}>Backup dati</div>
          <div style={{ fontSize: '11px', color: '#a8a8b8', lineHeight: 1.5, marginBottom: '14px' }}>Tutti i dati sono salvati nel browser. Esporta periodicamente un backup JSON per non perderli.</div>
          <button onClick={exportData} style={{ width: '100%', padding: '14px', marginBottom: '10px', background: 'linear-gradient(135deg, #66bb6a 0%, #43a047 100%)', color: 'white', border: 'none', borderRadius: '12px', fontSize: '13px', fontWeight: '700', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}><Download size={16}/> Esporta backup JSON</button>
          <input ref={fileInputRef} type="file" accept="application/json" onChange={importData} style={{ display: 'none' }}/>
          <button onClick={() => fileInputRef.current?.click()} style={{ width: '100%', padding: '14px', background: 'linear-gradient(135deg, #42a5f5 0%, #1e88e5 100%)', color: 'white', border: 'none', borderRadius: '12px', fontSize: '13px', fontWeight: '700', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}><Upload size={16}/> Importa backup</button>
        </div>
        <div style={{ ...glassCard, padding: '16px', marginBottom: '14px', borderLeft: '3px solid #ef5350' }}>
          <div style={{ fontSize: '13px', fontWeight: '700', color: '#ef5350', marginBottom: '8px' }}>Zona pericolo</div>
          <div style={{ fontSize: '11px', color: '#a8a8b8', lineHeight: 1.5, marginBottom: '14px' }}>Cancella tutti i dati. Operazione irreversibile.</div>
          <button onClick={clearAll} style={{ width: '100%', padding: '14px', background: 'rgba(239, 83, 80, 0.2)', color: '#ef5350', border: '1px solid rgba(239, 83, 80, 0.5)', borderRadius: '12px', fontSize: '13px', fontWeight: '700', cursor: 'pointer' }}>Cancella tutti i dati</button>
        </div>
        <div style={{ ...glassCard, padding: '16px' }}>
          <div style={{ fontSize: '13px', fontWeight: '700', color: '#fff', marginBottom: '8px' }}>Info app</div>
          <div style={{ fontSize: '11px', color: '#a8a8b8', lineHeight: 1.6 }}>
            <strong style={{ color: '#fff' }}>V8 Tracker PWA v2</strong><br/>
            Programma: V8 Block Cutting · 8 Settimane · 100kg<br/>
            Storage: localStorage del browser<br/>
            Funziona offline dopo la prima apertura<br/>
            Immagini esercizi: Wikimedia Commons (con fallback SVG)
          </div>
        </div>
      </div>
    </div>
  );
}

// ============= MAIN =============

function App() {
  const [screen, setScreen] = useState('home');
  const goHome = useCallback(() => setScreen('home'), []);
  // Quando siamo fuori da home, intercetta il tasto indietro per tornare alla home
  useAndroidBack(goHome, screen !== 'home');
  // Wrapper per navigate da HomeScreen che ora pusha history (così back funziona da subito)
  const navigate = useCallback((s) => setScreen(s), []);
  return (
    <TimerProvider>
      <div style={{ fontFamily: '-apple-system, "Helvetica Neue", Arial, sans-serif', maxWidth: '480px', margin: '0 auto', minHeight: '100vh' }}>
        {screen === 'home' && <HomeScreen navigate={navigate}/>}
        {screen === 'workout' && <WorkoutScreen goBack={goHome}/>}
        {screen === 'peso' && <PesoScreen goBack={goHome}/>}
        {screen === 'dashboard' && <DashboardScreen goBack={goHome}/>}
        {screen === 'recovery' && <RecoveryScreen goBack={goHome}/>}
        {screen === 'guide' && <GuideScreen goBack={goHome}/>}
        {screen === 'settings' && <SettingsScreen goBack={goHome}/>}
      </div>
    </TimerProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BackStackProvider><TechModalProvider><App/></TechModalProvider></BackStackProvider>);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
